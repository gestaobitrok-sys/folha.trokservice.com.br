<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TROK Service · Folha de Pagamento por Loja</title>
<style>
:root{
  --bg: #f4f2ee;
  --panel: #ffffff;
  --ink: #1c1f23;
  --ink-dim: #5b6168;
  --line: #e3e0d8;
  --side-bg: #181a1f;
  --side-bg2: #20232a;
  --side-line: #2c2f37;
  --side-ink: #c9cdd4;
  --side-ink-dim: #82868f;
  --accent: #d97a1f;
  --accent-ink: #ffffff;
  --accent-soft: #fbe6cf;
  --good: #2f7a4f;
  --good-soft: #e4f1e8;
  --bad: #b53a3a;
  --bad-soft: #fbe7e7;
  --warn: #b8860b;
  --warn-soft: #fbf0d9;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(20,20,15,.06), 0 6px 20px -8px rgba(20,20,15,.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--ink);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}
::selection{background:var(--accent-soft);}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

.app-shell{
  display:grid;
  grid-template-columns:248px 1fr;
  grid-template-rows:56px 1fr;
  height:100vh;
}
.topbar{
  grid-column:1 / -1;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 16px;
  background:var(--side-bg);
  border-bottom:1px solid var(--side-line);
  color:#fff;
  z-index:5;
}
.brand{
  display:flex;align-items:center;gap:8px;
  font-weight:700;letter-spacing:.2px;font-size:15px;
  white-space:nowrap;
}
.brand .mark{
  width:26px;height:26px;border-radius:7px;
  background:linear-gradient(135deg,var(--accent),#8a4a10);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:#fff;
  box-shadow:0 1px 0 rgba(255,255,255,.15) inset;
}
.brand .sub{font-weight:500;color:var(--side-ink-dim);font-size:12px;}
.topbar-spacer{flex:1;}
.competencia-box{
  display:flex;align-items:center;gap:6px;
  background:var(--side-bg2);border:1px solid var(--side-line);
  border-radius:8px;padding:4px 8px;color:var(--side-ink);font-size:12.5px;
}
.competencia-box input{
  background:transparent;border:none;color:#fff;font-weight:600;
  width:64px;text-align:center;font-family:var(--mono);font-size:13px;
}
.topbar-actions{display:flex;gap:6px;flex-wrap:nowrap;}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;
  transition:transform .05s ease, background .15s ease, border-color .15s ease;
  white-space:nowrap;
}
.btn:hover{border-color:#c9c4b8;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.btn-primary:hover{background:#c26d18;}
.btn-ghost-dark{background:var(--side-bg2);border-color:var(--side-line);color:var(--side-ink);}
.btn-ghost-dark:hover{background:#262a32;color:#fff;}
.btn-sm{padding:4px 9px;font-size:12px;border-radius:6px;}
.btn-danger{color:var(--bad);border-color:#e3c3c3;background:#fff;}
.btn-danger:hover{background:var(--bad-soft);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.icon-btn{
  width:30px;height:30px;border-radius:7px;border:1px solid var(--line);
  background:var(--panel);display:inline-flex;align-items:center;justify-content:center;
  font-size:14px;padding:0;
}
.icon-btn:hover{border-color:#c9c4b8;background:#f8f6f2;}

.sidebar{
  background:var(--side-bg);
  color:var(--side-ink);
  border-right:1px solid var(--side-line);
  overflow-y:auto;
  display:flex;flex-direction:column;
}
.side-search{
  padding:12px 12px 8px;
}
.side-search input{
  width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--side-line);
  background:var(--side-bg2);color:#fff;font-size:13px;
}
.side-search input::placeholder{color:var(--side-ink-dim);}
.side-list{list-style:none;margin:4px 0 12px;padding:0 8px;flex:1;}
.side-item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:9px 10px;border-radius:8px;margin-bottom:2px;
  cursor:pointer;color:var(--side-ink);font-size:13px;
}
.side-item:hover{background:var(--side-bg2);}
.side-item.active{background:var(--accent);color:#fff;font-weight:700;}
.side-item .si-name{display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.side-item .si-flag{color:var(--warn);}
.side-item.active .si-flag{color:#fff;}
.side-item .si-meta{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;}
.side-item .si-count{font-size:11px;color:var(--side-ink-dim);}
.side-item.active .si-count{color:rgba(255,255,255,.85);}
.side-item .si-total{font-family:var(--mono);font-size:11.5px;}
.side-section-label{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--side-ink-dim);
  padding:10px 14px 4px;font-weight:700;
}
.side-foot{
  padding:10px 14px 14px;border-top:1px solid var(--side-line);
  font-size:11px;color:var(--side-ink-dim);
}
.side-foot b{color:var(--side-ink);}

.main{
  overflow-y:auto;
  padding:22px 26px 60px;
}
.view-header{
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  margin-bottom:18px;flex-wrap:wrap;
}
.view-title{display:flex;flex-direction:column;gap:3px;}
.view-title h1{font-size:21px;margin:0;font-weight:800;letter-spacing:-.2px;}
.view-title .view-sub{font-size:12.5px;color:var(--ink-dim);}
.view-actions{display:flex;gap:8px;flex-wrap:wrap;}

.kpis{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.kpi{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 16px;min-width:140px;box-shadow:var(--shadow);
}
.kpi .kpi-label{font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.06em;font-weight:700;}
.kpi .kpi-value{font-family:var(--mono);font-size:19px;font-weight:700;margin-top:3px;}
.kpi.good .kpi-value{color:var(--good);}
.kpi.warn .kpi-value{color:var(--warn);}
.kpi.pm-banco .kpi-value{color:#2e4f8c;}
.kpi.pm-dinheiro .kpi-value{color:#2f7a4f;}
.kpi.pm-caju .kpi-value{color:#9c4a16;}

.pm-chips{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
.pm-chip{
  font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;
  display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
}
.pm-chip.is-Banco{background:#e3ecfb;color:#1e3f7a;}
.pm-chip.is-Dinheiro{background:#e1f3e6;color:#1f5c39;}
.pm-chip.is-Caju{background:#fde6d2;color:#8a4710;}
.pm-chip .v{font-family:var(--mono);}

.dash-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;
}
.loja-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .08s ease, border-color .15s;
}
.loja-card:hover{border-color:var(--accent);transform:translateY(-1px);}
.loja-card .lc-name{font-weight:700;font-size:14.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.loja-card .lc-row{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-dim);margin-bottom:3px;}
.loja-card .lc-total{font-family:var(--mono);font-weight:700;font-size:16px;margin-top:6px;}
.loja-card.empty{opacity:.55;}
.loja-card.flagged{border-color:#e6c373;background:var(--warn-soft);}

.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
}
table.emp-table{width:100%;border-collapse:collapse;font-size:13px;}
table.emp-table thead th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--ink-dim);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);
  background:#faf9f6;position:sticky;top:0;
}
table.emp-table td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
table.emp-table tbody tr:hover{background:#fbfaf7;}
table.emp-table tbody tr:last-child td{border-bottom:none;}
.col-num{text-align:right;font-family:var(--mono);white-space:nowrap;}
.col-liquido{font-weight:700;color:var(--good);}
.emp-name{font-weight:700;}
.emp-cargo{color:var(--ink-dim);font-size:12px;}
.emp-badge-rateio{display:inline-block;margin-top:3px;font-size:10.5px;font-weight:700;color:#8a4710;background:#fde6d2;border-radius:99px;padding:2px 7px;}
.emp-badge-adiant{display:inline-block;margin-top:3px;margin-left:4px;font-size:10.5px;font-weight:700;color:#1f5c39;background:#e1f3e6;border-radius:99px;padding:2px 7px;}
.emp-extra-tag{font-size:11px;color:var(--ink-dim);}
.badge{
  display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;
  background:#eef1ed;color:#3c5d4a;
}
.badge.empresa-Contractus{background:#eaf0fb;color:#2e4f8c;}
.badge.empresa-BMComercio{background:#fdeee2;color:#9c4a16;}
.badge.empresa-MudScap{background:#f1ecfb;color:#5a3d99;}
.row-actions{display:flex;gap:6px;justify-content:flex-end;}
.loja-select-inline{
  font-size:12px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:#fff;
  max-width:140px;
}
.empty-state{
  padding:40px 20px;text-align:center;color:var(--ink-dim);
}
.empty-state .es-icon{font-size:30px;margin-bottom:8px;}

.toast-wrap{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:200;}
.toast{
  background:#1c1f23;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;
  box-shadow:0 6px 24px -6px rgba(0,0,0,.35);display:flex;align-items:center;gap:8px;
  animation:toastin .18s ease;
}
.toast.good{background:#1f3b29;}
.toast.bad{background:#3b1f1f;}
@keyframes toastin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

.modal-overlay{
  position:fixed;inset:0;background:rgba(20,18,14,.45);display:flex;align-items:center;justify-content:center;
  z-index:100;padding:20px;
}
.modal{
  background:var(--panel);border-radius:14px;max-width:680px;width:100%;max-height:88vh;
  display:flex;flex-direction:column;box-shadow:0 24px 60px -10px rgba(0,0,0,.4);
}
.modal.modal-lg{max-width:900px;}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;padding:16px 20px;
  border-bottom:1px solid var(--line);
}
.modal-head h2{font-size:16px;margin:0;font-weight:800;}
.modal-body{padding:18px 20px;overflow-y:auto;flex:1;}
.modal-foot{
  display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);
}
.field{margin-bottom:13px;}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-dim);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;}
.field input[type=text], .field input[type=date], .field input[type=number], .field select, .field textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);
}
.field textarea{resize:vertical;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.section-title{
  font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-dim);
  margin:18px 0 8px;display:flex;align-items:center;justify-content:space-between;
}
.line-item{
  display:flex;gap:8px;align-items:center;margin-bottom:6px;
}
.line-item input[type=text]{flex:2;padding:7px 9px;border:1px solid var(--line);border-radius:7px;}
.line-item input[type=number]{flex:1;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-family:var(--mono);max-width:120px;}
.line-item .rm{
  border:none;background:none;color:var(--bad);font-size:16px;cursor:pointer;padding:2px 6px;
}
.summary-box{
  background:#faf9f6;border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-top:14px;
  display:flex;flex-direction:column;gap:4px;font-size:13px;
}
.summary-box .sr{display:flex;justify-content:space-between;}
.summary-box .sr.total{font-weight:800;font-size:15px;border-top:1px dashed var(--line);margin-top:4px;padding-top:6px;}
.summary-box .sr .val{font-family:var(--mono);}
.summary-box .sr.total .val{color:var(--good);}

.dropzone{
  border:2px dashed #cfc8b6;border-radius:12px;padding:28px 16px;text-align:center;color:var(--ink-dim);
  background:#fbfaf7;cursor:pointer;
}
.dropzone.drag{border-color:var(--accent);background:var(--accent-soft);}
.dropzone .dz-icon{font-size:26px;margin-bottom:6px;}
.filelist{margin-top:10px;font-size:12.5px;}
.filelist .fitem{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);}

.review-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px;}
.review-table th{text-align:left;font-size:10.5px;color:var(--ink-dim);text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line);}
.review-table td{padding:6px 8px;border-bottom:1px solid var(--line);}
.status-pill{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;white-space:nowrap;}
.status-pill.update{background:var(--good-soft);color:var(--good);}
.status-pill.new{background:var(--warn-soft);color:var(--warn);}
.status-pill.skip{background:#eee;color:#888;}
.review-table select{font-size:12px;padding:3px 5px;border-radius:6px;border:1px solid var(--line);}
.review-table .delta-up{color:var(--good);}
.review-table .delta-down{color:var(--bad);}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;}
.tab{padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink-dim);border-bottom:2px solid transparent;cursor:pointer;}
.tab.active{color:var(--ink);border-color:var(--accent);}

.checklist{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.chk-pill{
  display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;
  padding:5px 11px;font-size:12.5px;cursor:pointer;background:#fff;
}
.chk-pill input{margin:0;}

#printArea{display:none;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{position:absolute;top:0;left:0;width:100%;display:block;padding:0;}
  *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; color-adjust:exact; }
  @page{ size: A4 landscape; margin:9mm 8mm; }
  .rpt-loja-block{ page-break-before:always; break-before:page; margin-bottom:0; }
  .rpt-loja-block:first-of-type{ page-break-before:auto; break-before:auto; }
  .rpt-loja-block h3{ page-break-after:avoid; break-after:avoid; }
  .rpt-resumo-table{ page-break-inside:avoid; break-inside:avoid; }
  table.rpt-table{ page-break-inside:auto; }
  table.rpt-table thead{ display:table-header-group; }
  table.rpt-table tr{ page-break-inside:avoid; break-inside:avoid; }
  .rpt-loja-pagto{ page-break-inside:avoid; break-inside:avoid; }
  .rpt-pagto-dash{ page-break-before:always; break-before:page; page-break-inside:avoid; break-inside:avoid; }
}
.rpt-head{
  margin-bottom:16px;padding:14px 16px;border-radius:8px;
  background:linear-gradient(120deg,#1c1f23,#2c3540 60%,var(--accent));color:#fff;
}
.rpt-head h1{font-size:18px;margin:0 0 3px;letter-spacing:-.2px;}
.rpt-head .rpt-meta{font-size:11.5px;color:#dfe3e8;}
.rpt-resumo-table{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:20px;}
.rpt-resumo-table th{text-align:left;background:#2c3540;color:#fff;padding:6px 8px;font-size:10px;text-transform:uppercase;letter-spacing:.04em;}
.rpt-resumo-table th.num, .rpt-resumo-table td.num{text-align:right;}
.rpt-resumo-table td{padding:5px 8px;border-bottom:1px solid #e3e0d8;}
.rpt-resumo-table tbody tr:nth-child(even){background:#f6f4ef;}
.rpt-resumo-table tfoot td{font-weight:800;border-top:2px solid #1c1f23;background:#fbe6cf;color:#7a3d0c;}
.rpt-loja-block{margin-bottom:22px;page-break-inside:avoid;}
.rpt-loja-block h3{
  font-size:13px;margin:0 0 0;padding:7px 10px;border-radius:6px 6px 0 0;
  background:var(--accent);color:#fff;display:flex;justify-content:space-between;align-items:center;
}
.rpt-loja-block h3 .rpt-loja-total{font-family:var(--mono);font-size:12.5px;}
table.rpt-table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:11px;margin-bottom:0;border:1px solid #e3e0d8;}
table.rpt-table th{text-align:left;background:#f6f4ef;color:#5b6168;border-bottom:1px solid #d8d4c8;padding:5px 7px;font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;overflow-wrap:break-word;}
table.rpt-table td{padding:5px 7px;border-bottom:1px solid #ece9e1;vertical-align:top;overflow-wrap:break-word;word-break:break-word;}
table.rpt-table tbody tr:nth-child(even){background:#fbfaf7;}
table.rpt-table td.num{text-align:right;font-family:var(--mono);white-space:normal;}
table.rpt-table th:nth-child(1), table.rpt-table td:nth-child(1){width:15%;}
table.rpt-table th:nth-child(2), table.rpt-table td:nth-child(2){width:8%;}
table.rpt-table th:nth-child(3), table.rpt-table td:nth-child(3){width:8%;}
table.rpt-table th:nth-child(4), table.rpt-table td:nth-child(4){width:21%;}
table.rpt-table th:nth-child(5), table.rpt-table td:nth-child(5){width:21%;}
table.rpt-table th:nth-child(6), table.rpt-table td:nth-child(6){width:14%;}
table.rpt-table th:nth-child(7), table.rpt-table td:nth-child(7){width:13%;}
.rpt-cargo{font-size:9.5px;color:#888;}
.rpt-item-line{font-size:10.5px;white-space:normal;line-height:1.5;word-break:break-word;}
.rpt-item-line b{color:var(--bad);}
.rpt-item-line.is-provento b{color:var(--good);}
.rpt-dash{color:#999;}
.rpt-pagto{font-size:10px;white-space:normal;}
.rpt-pagto.is-Banco{color:#2e4f8c;font-weight:700;}
.rpt-pagto.is-Dinheiro{color:#2f7a4f;font-weight:700;}
.rpt-pagto.is-Caju{color:#9c4a16;font-weight:700;}
.rpt-subtotal td{font-weight:800;background:#eef1ed;border-top:1.5px solid #2f7a4f;border-bottom:1.5px solid #2f7a4f;}
.rpt-loja-pagto{
  display:flex;gap:8px;padding:8px 10px;background:#faf9f6;border:1px solid #e3e0d8;border-top:none;
  border-radius:0 0 6px 6px;
}
.rpt-loja-chip{
  flex:1;display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:6px;font-size:10.5px;font-weight:700;
}
.rpt-loja-chip.is-Banco{background:#e3ecfb;color:#1e3f7a;}
.rpt-loja-chip.is-Dinheiro{background:#e1f3e6;color:#1f5c39;}
.rpt-loja-chip.is-Caju{background:#fde6d2;color:#8a4710;}
.rpt-loja-chip .val{margin-left:auto;font-family:var(--mono);}
.rpt-grand{
  margin-top:12px;border-radius:8px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;
  background:#1c1f23;color:#fff;
}

<script>

var STORAGE_KEY = 'estado';

/* ===================== SINCRONIZAÇÃO COM O SERVIDOR =====================
   Esse app foi feito originalmente usando window.storage.get/set (armazenamento
   do ambiente onde ele rodava). Para funcionar como um site normal, com os dados
   salvos automaticamente no servidor (SQLite) em vez de ficarem presos num
   navegador só, implementamos aqui a mesma interface (get/set por chave),
   conversando com a API do nosso backend. O restante do app não precisa saber
   dessa troca — continua chamando window.storage.get/set normalmente. */
window.storage = {
  get: function(key, shared){
    return fetch('/api/state', {credentials:'include'}).then(function(r){
      if(r.status === 401){ window.location.href = '/login'; return {value:null}; }
      if(!r.ok) throw new Error('Falha ao carregar do servidor');
      return r.json();
    });
  },
  set: function(key, value, shared){
    return fetch('/api/state', {
      method:'PUT', credentials:'include', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({value:value})
    }).then(function(r){
      if(r.status === 401){ window.location.href = '/login'; return false; }
      return r.ok;
    });
  }
};
function sairApp(){
  fetch('/logout', {method:'POST', credentials:'include'}).then(function(){ window.location.href = '/login'; }).catch(function(){ window.location.href = '/login'; });

function uid(prefix){ return (prefix||'id') + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function escapeHtml(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function stripAccents(s){ return String(s||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,''); }
function toNum(v){
  if(typeof v === 'number') return v;
  if(!v) return 0;
  var s = String(v).trim();
  if(s.indexOf(',') > -1){ s = s.replace(/\./g,'').replace(',','.'); }
  var n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function toBRL(n){
  n = toNum(n);
  return n.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function todayBR(){
  var d = new Date();
  function p(x){ return String(x).padStart(2,'0'); }
  return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }
function dataBR(iso){
  if(!iso) return '';
  var p = iso.split('-');
  if(p.length !== 3) return iso;
  return p[2]+'/'+p[1]+'/'+p[0];
}
function $(sel, root){ return (root||document).querySelector(sel); }
function $all(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function on(root, evt, sel, handler){
  root.addEventListener(evt, function(e){
    var t = e.target.closest(sel);
    if(t && root.contains(t)) handler(e, t);
  });
}
function debounce(fn, ms){
  var t;
  return function(){
    var args = arguments;
    clearTimeout(t);
    t = setTimeout(function(){ fn.apply(null, args); }, ms);
  };
}

var STOPWORDS = {DA:1,DE:1,DO:1,DOS:1,DAS:1,E:1};
var SKIP_TOKENS = {CT:1,HG:1,AG:1,MT:1,PR:1,PP:1,MH:1,AB:1,BR:1,KN:1,CC:1,MP:1,JV:1,MC:1,ESPECIE:1};
function normName(s){
  var t = stripAccents(s||'').toUpperCase().replace(/[^A-Z\s]/g,' ');
  var toks = t.split(/\s+/).filter(Boolean);
  var out = [];
  for(var i=0;i<toks.length;i++){
    var w = toks[i];
    if(w === 'FCO' || w === 'FRC') w = 'FRANCISCO';
    if(STOPWORDS[w] || SKIP_TOKENS[w] || w.length<=1) continue;
    out.push(w);
  }
  return out;
}
function nameScore(a, b){
  var aset = {}, bset = {}, i;
  for(i=0;i<a.length;i++) aset[a[i]]=1;
  for(i=0;i<b.length;i++) bset[b[i]]=1;
  var ak = Object.keys(aset), bk = Object.keys(bset);
  if(!ak.length || !bk.length) return 0;
  var inter = 0;
  for(i=0;i<ak.length;i++) if(bset[ak[i]]) inter++;
  var first = (a[0] && b[0] && a[0]===b[0]) ? 1 : 0;
  return (2*inter/(ak.length+bk.length)) + first*0.3;
}

function calcLiquido(f){
  var p = (f.proventosExtras||[]).reduce(function(s,x){ return s+toNum(x.valor); }, 0);
  var d = (f.descontosExtras||[]).reduce(function(s,x){ return s+toNum(x.valor); }, 0);
  return round2(toNum(f.salarioBaseMes) + p - d);
}
function totalProventosExtras(f){ return (f.proventosExtras||[]).reduce(function(s,x){return s+toNum(x.valor);},0); }
function totalDescontosExtras(f){ return (f.descontosExtras||[]).reduce(function(s,x){return s+toNum(x.valor);},0); }
function totalCaju(f){ return round2(toNum(f.valeAlimentacao) + toNum(f.valeTransporte)); }
function calcTotalPagar(f){ return round2(calcLiquido(f) + totalCaju(f)); }

function funcionariosPorLoja(loja){
  return state.funcionarios.filter(function(f){ return f.loja === loja && f.ativo !== false; });
}
/* Retorna como o custo total de um funcionário se distribui entre lojas.
   Se o funcionário tiver rateioLojas configurado (percentuais que somam ~100%):
     - o LÍQUIDO do salário (Banco/Dinheiro) é dividido proporcionalmente entre as lojas do rateio;
     - o Vale Alimentação/Transporte (Caju) NÃO é dividido — o valor cheio é atribuído a
       CADA loja do rateio, porque é o valor que de fato é cadastrado para pagamento em
       cada unidade (não uma fração dele).
   Caso contrário (sem rateio), 100% do valor (líquido + Caju) é atribuído à loja cadastrada (f.loja). */
function custoRateado(f){
  var liquido = calcLiquido(f);
  var caju = totalCaju(f);
  var rateio = (f.rateioLojas||[]).filter(function(r){ return r.loja && toNum(r.percentual) > 0; });
  if(rateio.length){
    var somaPerc = rateio.reduce(function(s,r){ return s + toNum(r.percentual); }, 0);
    if(somaPerc > 0){
      return rateio.map(function(r){
        var liquidoParte = round2(liquido * (toNum(r.percentual)/somaPerc));
        return {loja: r.loja, percentual: toNum(r.percentual), valor: round2(liquidoParte + caju), valorLiquido: liquidoParte, valorCaju: caju};
      });
    }
  }
  return [{loja: f.loja, percentual: 100, valor: round2(liquido+caju), valorLiquido: liquido, valorCaju: caju}];
}
function totalLoja(loja){

  return state.funcionarios.filter(function(f){ return f.ativo !== false; }).reduce(function(s,f){
    var partes = custoRateado(f);
    var parte = partes.find(function(p){ return p.loja === loja; });
    return s + (parte ? parte.valor : 0);
  }, 0);
}
/* Lista, para uma loja, TODOS os funcionários com alguma parte do custo atribuída
   a ela — os que têm essa loja como loja cadastrada (sem rateio, 100%) E os que
   vêm de outra loja mas têm uma fatia rateada para cá. É essa lista (e não
   funcionariosPorLoja, que só olha a loja cadastrada) que deve ser usada em
   relatórios/telas por loja, para que funcionários com rateio apareçam. */
function funcionariosEfetivosNaLoja(loja){
  var out = [];
  state.funcionarios.forEach(function(f){
    if(f.ativo === false) return;
    var partes = custoRateado(f);
    var parte = partes.find(function(p){ return p.loja === loja; });
    if(!parte) return;
    out.push({
      f: f,
      valorLoja: parte.valor,
      percentualLoja: parte.percentual,
      temRateio: !!(f.rateioLojas && f.rateioLojas.filter(function(r){return r.loja && toNum(r.percentual)>0;}).length),
      externo: (f.loja !== loja)
    });
  });
  out.sort(function(a,b){ return a.f.nome.localeCompare(b.f.nome,'pt-BR'); });
  return out;
}
function totalGeral(){
  return state.funcionarios.filter(function(f){return f.ativo!==false;}).reduce(function(s,f){ return s + calcTotalPagar(f); }, 0);
}
function totaisPorFormaPagamento(lista){
  var out = {Banco:0, Dinheiro:0, Caju:0};
  lista.forEach(function(f){
    var fp = FORMAS_PAGAMENTO_SALARIO.indexOf(f.formaPagamento) > -1 ? f.formaPagamento : 'Banco';
    out[fp] = (out[fp]||0) + calcLiquido(f);
    out.Caju = (out.Caju||0) + totalCaju(f);
  });
  return out;
}
/* Igual a totaisPorFormaPagamento, mas trabalha sobre entries de
   funcionariosEfetivosNaLoja(), escalando cada valor pela fração (%) que
   pertence àquela loja — evita somar 2x quem tem rateio em mais de uma loja. */
function totaisPorFormaPagamentoLoja(entries){
  var out = {Banco:0, Dinheiro:0, Caju:0};
  entries.forEach(function(e){
    var f = e.f;
    var frac = toNum(e.percentualLoja) / 100;
    var fp = FORMAS_PAGAMENTO_SALARIO.indexOf(f.formaPagamento) > -1 ? f.formaPagamento : 'Banco';
    // Arredonda o líquido normalmente, mas o Caju é a DIFERENÇA entre o total já
    // arredondado desta parte (e.valorLoja, vindo de custoRateado) e o líquido —
    // assim líquido + Caju sempre bate exatamente com o total exibido no card da
    // loja, mesmo quando a fração de rateio gera restos de centavos.
    var liquidoShare = round2(calcLiquido(f) * frac);
    var cajuShare = round2((e.valorLoja !== undefined ? e.valorLoja : round2(calcTotalPagar(f) * frac)) - liquidoShare);
    out[fp] = (out[fp]||0) + liquidoShare;
    out.Caju = (out.Caju||0) + cajuShare;
  });
  return out;
}
function migrarFuncionario(f){
  if(FORMAS_PAGAMENTO_SALARIO.indexOf(f.formaPagamento) === -1) f.formaPagamento = 'Banco';
  if(f.valeAlimentacao === undefined || f.valeAlimentacao === null) f.valeAlimentacao = 0;
  if(f.valeTransporte === undefined || f.valeTransporte === null) f.valeTransporte = 0;
  f.valeAlimentacao = toNum(f.valeAlimentacao);
  f.valeTransporte = toNum(f.valeTransporte);
  if(!Array.isArray(f.rateioLojas)) f.rateioLojas = [];
  if(!f.adiantamentos || typeof f.adiantamentos !== 'object') f.adiantamentos = {};
}

/* ===================== PERSISTÊNCIA ===================== */
var storageUnavailable = false;

function loadState(cb){
  // Carregamento defensivo: qualquer falha no armazenamento (chave inexistente,
  // erro interno do serviço, storage desabilitado, etc.) cai graciosamente nos
  // dados padrão (folha de Junho/2026) sem travar o app nem assustar o usuário.
  var finished = false;
  function fallback(){
    if(finished) return;
    finished = true;
    state = defaultState();
    cb(true);
  }
  try{
    if(window.storage && typeof window.storage.get === 'function'){
      window.storage.get(STORAGE_KEY, false).then(function(res){
        if(finished) return;
        if(res && res.value){
          try{
            var parsed = JSON.parse(res.value);
            if(parsed && Array.isArray(parsed.funcionarios)){
              state = parsed;
              if(!state.lojas) state.lojas = LOJAS_PADRAO.slice();
              if(!state.empresas) state.empresas = EMPRESAS_PADRAO.slice();
              if(!state.catalogo) state.catalogo = CATALOGO_PADRAO.slice();
              if(!state.historico) state.historico = {};
              if(!state.datasPagamento) state.datasPagamento = {};
              state.funcionarios.forEach(migrarFuncionario);
              finished = true;
              cb(false);
              return;
            }
          }catch(e){ /* JSON inválido: ignora e usa padrão */ }
        }
        fallback();
      }).catch(function(){
        // Chave ainda não existe (primeiro uso) ou o serviço de armazenamento
        // está indisponível agora — não é um erro fatal, apenas seguimos com
        // os dados padrão. O app tenta salvar normalmente nas próximas ações.
        fallback();
      });
      // rede de segurança: se a promessa nunca resolver, não deixa o app preso
      setTimeout(fallback, 6000);
    } else {
      fallback();
    }
  }catch(e){
    fallback();
  }
}

function saveState(opts){
  opts = opts || {};
  state.lastSaved = new Date().toISOString();
  var json;
  try{ json = JSON.stringify(state); }catch(e){ json = null; }
  function done(ok){
    ui.unsaved = false;
    renderSaveIndicator();
    if(!ok && !storageUnavailable){
      storageUnavailable = true;
      if(opts.toast !== false) toast('Não foi possível salvar no armazenamento agora. Use "⬇️ Backup" para guardar uma cópia.', 'bad');
      return;
    }
    if(ok && opts.toast !== false) toast('Dados salvos.', 'good');
    if(ok) storageUnavailable = false;
  }
  if(json && window.storage && typeof window.storage.set === 'function'){
    try{
      window.storage.set(STORAGE_KEY, json, false).then(function(r){ done(!!r); }).catch(function(){ done(false); });
    }catch(e){ done(false); }
  } else {
    done(false);
  }
}
var autoSave = debounce(function(){ saveState({toast:false}); }, 900);
function markDirty(){ ui.unsaved = true; renderSaveIndicator(); autoSave(); }

/* ===================== TOASTS ===================== */
function toast(msg, kind){
  var wrap = document.getElementById('toastWrap');
  var d = document.createElement('div');
  d.className = 'toast' + (kind ? ' '+kind : '');
  d.textContent = msg;
  wrap.appendChild(d);
  setTimeout(function(){ d.style.opacity='0'; d.style.transition='opacity .3s'; setTimeout(function(){ d.remove(); }, 320); }, 2600);
}

/* ===================== SIDEBAR ===================== */
function flagLoja(loja){ return loja === 'A Definir'; }

function renderSidebar(){
  var sb = document.getElementById('sidebar');
  var lojas = state.lojas;
  var html = '<div class="side-search"><input type="text" id="sideSearch" placeholder="Buscar funcionário…" value="'+escapeHtml(ui.search)+'"></div>';
  html += '<ul class="side-list">';
  html += sideItemHtml('__dashboard__', 'Visão geral', state.funcionarios.filter(function(f){return f.ativo!==false;}).length, totalGeral(), ui.view.type==='dashboard');
  html += '<div class="side-section-label">Lojas</div>';
  lojas.forEach(function(loja){
    if(loja === 'Administração/Sócios' || loja === 'A Definir') return;
    var list = funcionariosEfetivosNaLoja(loja);
    html += sideItemHtml(loja, loja, list.length, totalLoja(loja), ui.view.type==='loja' && ui.view.loja===loja);
  });
  html += '<div class="side-section-label">Outros</div>';
  ['Administração/Sócios','A Definir'].forEach(function(loja){
    var list = funcionariosEfetivosNaLoja(loja);
    html += sideItemHtml(loja, loja, list.length, totalLoja(loja), ui.view.type==='loja' && ui.view.loja===loja, flagLoja(loja));
  });
  html += '</ul>';
  html += '<div class="side-foot">TROK Service · <b>'+state.funcionarios.filter(function(f){return f.ativo!==false;}).length+'</b> funcionários ativos</div>';
  sb.innerHTML = html;

  $('#sideSearch').addEventListener('input', function(e){
    ui.search = e.target.value;
    if(ui.search.trim()){ ui.view = {type:'search'}; }
    else if(ui.view.type==='search'){ ui.view = {type:'dashboard'}; }
    renderSidebarActiveOnly();
    renderMain();
  });

  $all('.side-item', sb).forEach(function(it){
    it.addEventListener('click', function(){
      var key = it.dataset.key;
      ui.search = '';
      if(key === '__dashboard__') ui.view = {type:'dashboard'};
      else ui.view = {type:'loja', loja:key};
      renderSidebar();
      renderMain();
    });
  });
}
function renderSidebarActiveOnly(){
  $all('.side-item').forEach(function(it){
    var active = false;
    if(ui.view.type==='dashboard' && it.dataset.key==='__dashboard__') active=true;
    if(ui.view.type==='loja' && it.dataset.key===ui.view.loja) active=true;
    it.classList.toggle('active', active);
  });
}
function sideItemHtml(key, label, count, total, active, flagged){
  return '<li class="side-item'+(active?' active':'')+'" data-key="'+escapeHtml(key)+'">' +
    '<span class="si-name">'+(flagged?'<span class="si-flag">⚠️</span>':'')+escapeHtml(label)+'</span>' +
    '<span class="si-meta"><span class="si-total">R$ '+toBRL(total)+'</span><span class="si-count">'+count+' func.</span></span>' +
  '</li>';
}

  html += '<div class="dash-grid">';
  lojas.forEach(function(loja){

      '<div class="lc-row"><span>Funcionários</span><span>'+entries.length+(entries.some(function(e){return e.externo;})?' 🔀':'')+'</span></div>' +
      '<div class="lc-total">R$ '+toBRL(total)+'</div>' +
      pmChipsHtml(totaisPorFormaPagamentoLoja(entries)) +

/* indica se alguma parte do custo desta loja vem de rateio (funcionário cadastrado
   em outra loja mas com % de custo atribuído aqui), para exibir um aviso visual */
function rateioAfetaLoja(loja){
  return state.funcionarios.some(function(f){
    if(f.ativo === false || !f.rateioLojas || !f.rateioLojas.length) return false;
    return f.rateioLojas.some(function(r){ return r.loja === loja; });
  });
}

function renderEmployeeTable(list, opts){
  opts = opts || {};
  if(list.length === 0){
    return '<div class="panel"><div class="empty-state"><div class="es-icon">🗂️</div>Nenhum funcionário aqui ainda.<br>Use "Adicionar funcionário" para começar.</div></div>';
  }
  // normaliza para um formato único {f, valorLoja, percentualLoja, externo} — quando
  // não vem de funcionariosEfetivosNaLoja (ex: busca global), valorLoja = 100% do total.
  var rows = list.map(function(item){
    if(opts.entries) return item;
    return {f:item, valorLoja: calcTotalPagar(item), percentualLoja: 100, externo:false, temRateio:false};
  });
  var html = '<div class="panel" style="overflow-x:auto;"><table class="emp-table"><thead><tr>' +
    '<th>Funcionário</th><th>Empresa</th>'+(opts.showLoja?'<th>Loja</th>':'')+
    '<th class="col-num">Salário base</th><th class="col-num">Adicionais</th><th class="col-num">Descontos</th>' +
    '<th class="col-num">Líquido salário</th><th>Pagto. salário</th><th class="col-num">🍱 Caju (VA+VT)</th><th class="col-num">Total '+(opts.loja?'nesta loja':'a pagar')+'</th><th></th></tr></thead><tbody>';
  rows.forEach(function(row){
    var f = row.f;
    var liquido = calcLiquido(f);
    var caju = totalCaju(f);
    var parcial = toNum(row.percentualLoja) < 100;
    html += '<tr data-id="'+f.id+'">' +
      '<td><div class="emp-name">'+escapeHtml(f.nome)+'</div><div class="emp-cargo">'+escapeHtml(f.cargo||'')+'</div>'+
        (row.externo ? '<div class="emp-badge-rateio" title="Loja cadastrada deste funcionário">🔀 vindo de '+escapeHtml(f.loja)+'</div>' : '') +
        rateioBadgeHtml(f)+adiantamentoBadgeHtml(f)+'</td>' +
      '<td><span class="badge '+empresaClass(f.empresa)+'">'+escapeHtml(f.empresa||'—')+'</span></td>' +
      (opts.showLoja ? '<td>'+renderLojaSelectInline(f)+'</td>' : '') +
      '<td class="col-num">R$ '+toBRL(f.salarioBaseMes)+'</td>' +
      '<td class="col-num">'+(totalProventosExtras(f)>0 ? '+ R$ '+toBRL(totalProventosExtras(f)) : '—')+'</td>' +
      '<td class="col-num">'+(totalDescontosExtras(f)>0 ? '− R$ '+toBRL(totalDescontosExtras(f)) : '—')+'</td>' +
      '<td class="col-num">R$ '+toBRL(liquido)+'</td>' +
      '<td>'+renderFormaPagamentoInline(f)+'</td>' +
      '<td class="col-num" title="Vale Alimentação: R$ '+toBRL(f.valeAlimentacao)+' · Vale Transporte: R$ '+toBRL(f.valeTransporte)+'">'+(caju>0 ? 'R$ '+toBRL(caju) : '—')+'</td>' +
      '<td class="col-num col-liquido">R$ '+toBRL(row.valorLoja)+(parcial ? ' <span style="font-weight:400;font-size:10.5px;color:var(--ink-dim);">('+toNum(row.percentualLoja).toFixed(0)+'% aqui)</span>' : '')+'</td>' +
      '<td><div class="row-actions">' +
        (opts.showLoja || row.externo ? '' : '<select class="loja-select-inline" data-act="mover" data-id="'+f.id+'">'+lojaOptionsHtml(f.loja)+'</select>') +
        '<button class="icon-btn" data-act="rateio" data-id="'+f.id+'" title="Rateio entre lojas">🔀</button>' +
        '<button class="icon-btn" data-act="editar" data-id="'+f.id+'" title="Editar">✏️</button>' +
        '<button class="icon-btn" data-act="excluir" data-id="'+f.id+'" title="Excluir">🗑️</button>' +
      '</div></td>' +
    '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}
function renderFormaPagamentoInline(f){
  var atual = FORMAS_PAGAMENTO_SALARIO.indexOf(f.formaPagamento) > -1 ? f.formaPagamento : 'Banco';
  return '<select class="loja-select-inline" data-act="pagamento" data-id="'+f.id+'">' +
    FORMAS_PAGAMENTO_SALARIO.map(function(p){ return '<option value="'+p+'"'+(p===atual?' selected':'')+'>'+pagamentoIcone(p)+' '+p+'</option>'; }).join('') +
    '</select>';
}
function pagamentoIcone(p){
  return p==='Banco' ? '🏦' : (p==='Dinheiro' ? '💵' : '🍱');
}
function renderLojaSelectInline(f){
  return '<select class="loja-select-inline" data-act="mover" data-id="'+f.id+'">'+lojaOptionsHtml(f.loja)+'</select>';
}
function lojaOptionsHtml(current){
  return state.lojas.map(function(l){
    return '<option value="'+escapeHtml(l)+'"'+(l===current?' selected':'')+'>'+escapeHtml(l)+'</option>';
  }).join('');
}
function rateioBadgeHtml(f){
  var rateio = (f.rateioLojas||[]).filter(function(r){ return r.loja && toNum(r.percentual)>0; });
  if(!rateio.length) return '';
  var titulo = rateio.map(function(r){ return r.loja+': '+toNum(r.percentual)+'%'; }).join(' · ');
  return '<div class="emp-badge-rateio" title="Rateado entre: '+escapeHtml(titulo)+'">🔀 '+rateio.map(function(r){return escapeHtml(r.loja)+' '+toNum(r.percentual)+'%';}).join(' · ')+'</div>';
}
function adiantamentoBadgeHtml(f){
  var ad = f.adiantamentos ? f.adiantamentos[state.competencia] : null;
  if(!ad) return '';
  return '<div class="emp-badge-adiant" title="Adiantamento (dia 15) importado desta competência">💰 Adiant. dia 15: R$ '+toBRL(ad.valorLiquido)+'</div>';
}
/* ===================== EVENTOS DA VIEW PRINCIPAL ===================== */
function wireMainEvents(){
  var main = document.getElementById('main');

  $all('.loja-card', main).forEach(function(card){
    card.addEventListener('click', function(){
      ui.view = {type:'loja', loja:card.dataset.key};
      renderSidebar();
      renderMain();
    });
  });
  var btnAddDash = $('#btnAddEmpDash', main);
  if(btnAddDash) btnAddDash.addEventListener('click', function(){ openEmployeeModal(null, null); });

  var btnAddLoja = $('#btnAddEmpLoja', main);
  if(btnAddLoja) btnAddLoja.addEventListener('click', function(){ openEmployeeModal(null, btnAddLoja.dataset.loja); });

  var btnPrintLoja = $('#btnPrintLoja', main);
  if(btnPrintLoja) btnPrintLoja.addEventListener('click', function(){ openPrintModal([btnPrintLoja.dataset.loja]); });

  on(main, 'click', '[data-act="editar"]', function(e, t){
    var f = state.funcionarios.find(function(x){ return x.id===t.dataset.id; });
    if(f) openEmployeeModal(f, null);
  });
  on(main, 'click', '[data-act="rateio"]', function(e, t){
    var f = state.funcionarios.find(function(x){ return x.id===t.dataset.id; });
    if(f) openRateioModal(f);
  });
  on(main, 'click', '[data-act="excluir"]', function(e, t){
    var f = state.funcionarios.find(function(x){ return x.id===t.dataset.id; });
    if(!f) return;
    confirmDialog('Excluir funcionário', 'Tem certeza que deseja excluir "'+f.nome+'"? Esta ação não pode ser desfeita.', function(){
      state.funcionarios = state.funcionarios.filter(function(x){ return x.id !== f.id; });
      markDirty();
      renderSidebar();
      renderMain();
      toast('Funcionário excluído.', 'good');
    });
  });
  on(main, 'change', '[data-act="mover"]', function(e, t){
    var f = state.funcionarios.find(function(x){ return x.id===t.dataset.id; });
    if(!f) return;
    var novaLoja = t.value;
    var antiga = f.loja;
    f.loja = novaLoja;
    markDirty();
    renderSidebar();
    renderMain();
    toast(f.nome.split(' ')[0]+' movido(a) de "'+antiga+'" para "'+novaLoja+'".', 'good');
  });
  on(main, 'change', '[data-act="pagamento"]', function(e, t){
    var f = state.funcionarios.find(function(x){ return x.id===t.dataset.id; });
    if(!f) return;
    f.formaPagamento = t.value;
    markDirty();
    toast(f.nome.split(' ')[0]+' agora recebe via '+t.value+'.', 'good');
  });
}

/* ===================== MODAL GENÉRICO ===================== */
function openModal(html, opts){
  opts = opts || {};
  closeModal();
  var ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.id = 'modalOverlay';
  ov.innerHTML = '<div class="modal'+(opts.large?' modal-lg':'')+'">'+html+'</div>';
  document.body.appendChild(ov);
  ov.addEventListener('mousedown', function(e){ if(e.target === ov && opts.closableBackdrop !== false) closeModal(); });
  document.addEventListener('keydown', escCloseHandler);
  return ov;
}
function escCloseHandler(e){ if(e.key === 'Escape') closeModal(); }
function closeModal(){
  var ov = document.getElementById('modalOverlay');
  if(ov) ov.remove();
  document.removeEventListener('keydown', escCloseHandler);
}
function confirmDialog(title, msg, onConfirm){
  var html =
    '<div class="modal-head"><h2>'+escapeHtml(title)+'</h2></div>' +
    '<div class="modal-body">'+escapeHtml(msg)+'</div>' +
    '<div class="modal-foot"><button class="btn" id="cdCancel">Cancelar</button><button class="btn btn-danger" id="cdOk">Confirmar exclusão</button></div>';
  var ov = openModal(html);
  $('#cdCancel', ov).addEventListener('click', closeModal);
  $('#cdOk', ov).addEventListener('click', function(){ closeModal(); onConfirm(); });
}
/* Pergunta a data efetiva de pagamento de uma folha/adiantamento antes de confirmar
   a importação — a folha costuma ser fechada/cadastrada alguns dias ANTES do dia em
   que o pagamento sai de fato, então guardamos essa data separada da competência
   (MM/AAAA) para depois dar pra consultar "quanto foi pago em tal dia". */
function pedirDataPagamento(rotulo, defaultDate, cb, opts){
  opts = opts || {};
  var html =
    '<div class="modal-head"><h2>📅 Data de pagamento</h2></div>' +
    '<div class="modal-body">' +
      '<p style="font-size:12.5px;color:var(--ink-dim);">A folha costuma ser fechada/cadastrada alguns dias antes do pagamento sair de fato. Informe o dia em que <b>'+escapeHtml(rotulo)+'</b> vai ser efetivamente paga — isso permite depois consultar quanto saiu em cada data.</p>' +
      '<label style="display:block;margin-top:10px;font-size:12.5px;font-weight:600;">Data de pagamento</label>' +
      '<input type="date" id="dpInput" value="'+escapeHtml(defaultDate||'')+'" style="margin-top:4px;">' +
    '</div>' +
    '<div class="modal-foot">' +
      (opts.permitirPular ? '<button class="btn" id="dpPular">Não se aplica / pular</button>' : '') +
      '<button class="btn btn-primary" id="dpOk">Confirmar</button>' +
    '</div>';
  var ov = openModal(html, {closableBackdrop:false});
  var input = $('#dpInput', ov);
  input.focus();
  function submit(){
    var val = input.value;
    if(!val){ toast('Informe a data de pagamento (ou use "pular").', 'bad'); return; }
    cb(val);
  }
  $('#dpOk', ov).addEventListener('click', submit);
  if(opts.permitirPular) $('#dpPular', ov).addEventListener('click', function(){ cb(null); });
  input.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); submit(); } });
}

  return '<div class="section-title">💰 Adiantamentos quinzenais importados (dia 15)</div>' +
    '<div class="panel" style="padding:8px 12px;margin-bottom:10px;">' +
    comps.map(function(c){
      var a = f.adiantamentos[c];
      return '<div class="sr"><span>'+escapeHtml(c)+(c===state.competencia?' <b>(competência atual)</b>':'')+'</span>' +
        '<span class="val">R$ '+toBRL(a.valorLiquido)+(toNum(a.provisaoValor) ? ' <span style="color:var(--ink-dim);font-weight:400;">(bruto R$ '+toBRL(a.valorBruto)+')</span>' : '')+'</span></div>';
    }).join('') +
    '<div style="font-size:11px;color:var(--ink-dim);margin-top:4px;">Somente informativo — importado do PDF de adiantamento. Não altera o cálculo do salário/proventos/descontos acima.</div>' +
    '</div>';
}
function openEmployeeModal(funcionario, lojaPreSelecionada){
  var isNew = !funcionario;
  var draft = funcionario ? JSON.parse(JSON.stringify(funcionario)) : {
    id: uid('f'),
    codigo: '',
    nome: '',
    cargo: '',
    empresa: state.empresas[0] || '',
    loja: lojaPreSelecionada || state.lojas[0],
    admissao: '',
    salarioContratual: 0,
    salarioBaseMes: 0,
    formaPagamento: 'Banco',
    valeAlimentacao: 0,
    valeTransporte: 0,
    proventosExtras: [],
    descontosExtras: [],
    rateioLojas: [],
    adiantamentos: {},
    observacao: '',
    ativo: true
  };

  var html =
    '<div class="modal-head"><h2>'+(isNew?'Adicionar funcionário':'Editar funcionário')+'</h2>' +
      '<button class="icon-btn" id="empClose">✕</button></div>' +
    '<div class="modal-body" id="empBody"></div>' +

  $('#empCancel', ov).addEventListener('click', closeModal);

  function renderBody(){
    var body = $('#empBody', ov);
    body.innerHTML =
      '<div class="field-row">' +
        '<div class="field"><label>Nome completo</label><input type="text" id="fNome" value="'+escapeHtml(draft.nome)+'" placeholder="Ex: João da Silva"></div>' +
        '<div class="field"><label>Cargo</label><input type="text" id="fCargo" value="'+escapeHtml(draft.cargo)+'" placeholder="Ex: Mecânico"></div>' +
      '</div>' +
      '<div class="field-row3">' +
        '<div class="field"><label>Empresa</label><select id="fEmpresa">'+state.empresas.map(function(e){return '<option'+(e===draft.empresa?' selected':'')+'>'+escapeHtml(e)+'</option>';}).join('')+'</select></div>' +

      '</div>' +
      '<div class="field-row">' +
        '<div class="field"><label>Salário base / mês (R$)</label><input type="number" step="0.01" id="fSalario" value="'+toNum(draft.salarioBaseMes)+'"></div>' +
        '<div class="field"><label>Salário contratual de referência (R$)</label><input type="number" step="0.01" id="fSalarioContratual" value="'+toNum(draft.salarioContratual)+'"></div>' +
      '</div>' +
      '<div class="field"><label>Forma de pagamento do salário</label><select id="fFormaPagamento">'+FORMAS_PAGAMENTO_SALARIO.map(function(p){return '<option value="'+p+'"'+(p===draft.formaPagamento?' selected':'')+'>'+pagamentoIcone(p)+' '+p+'</option>';}).join('')+'</select></div>' +

      '<div class="section-title">🍱 Caju — vale alimentação e vale transporte</div>' +
      '<p style="font-size:11.5px;color:var(--ink-dim);margin:-2px 0 8px;">Esses valores são pagos separadamente, via cartão Caju, e somados ao salário no total a pagar.</p>' +
      '<div class="field-row">' +
        '<div class="field"><label>Vale Alimentação (R$)</label><input type="number" step="0.01" id="fVA" value="'+toNum(draft.valeAlimentacao)+'"></div>' +
        '<div class="field"><label>Vale Transporte (R$)</label><input type="number" step="0.01" id="fVT" value="'+toNum(draft.valeTransporte)+'"></div>' +

  function renderLineItems(containerId, arr, kind){
    var c = $('#'+containerId, ov);
    if(arr.length === 0){ c.innerHTML = '<div style="font-size:12px;color:var(--ink-dim);margin-bottom:6px;">Nenhum item.</div>'; return; }

      return '<div class="line-item" data-idx="'+idx+'">' +
        '<input type="text" placeholder="Descrição" value="'+escapeHtml(item.descricao)+'" data-field="descricao">' +
        '<input type="number" step="0.01" placeholder="0,00" value="'+toNum(item.valor)+'" data-field="valor">' +
        '<button class="rm" title="Remover">✕</button>' +
      '</div>';
    }).join('');
    $all('.line-item', c).forEach(function(row){
      var idx = parseInt(row.dataset.idx,10);
      $all('input', row).forEach(function(inp){
        inp.addEventListener('input', function(){
          var field = inp.dataset.field;
          arr[idx][field] = field==='valor' ? toNum(inp.value) : inp.value;
          renderSummary();
        });
      });
      row.querySelector('.rm').addEventListener('click', function(){
        arr.splice(idx,1);
        renderLineItems(containerId, arr, kind);
        renderSummary();
      });
    });
  }

  function renderSummary(){
    var box = $('#empSummary', ov);
    if(!box) return;
    var p = draft.proventosExtras.reduce(function(s,x){return s+toNum(x.valor);},0);
    var d = draft.descontosExtras.reduce(function(s,x){return s+toNum(x.valor);},0);
    var liq = round2(toNum(draft.salarioBaseMes) + p - d);
    var caju = round2(toNum(draft.valeAlimentacao) + toNum(draft.valeTransporte));
    var totalGeralFunc = round2(liq + caju);
    box.innerHTML =
      '<div class="sr"><span>Salário base</span><span class="val">R$ '+toBRL(draft.salarioBaseMes)+'</span></div>' +
      '<div class="sr"><span>+ Adicionais</span><span class="val">R$ '+toBRL(p)+'</span></div>' +
      '<div class="sr"><span>− Descontos</span><span class="val">R$ '+toBRL(d)+'</span></div>' +
      '<div class="sr total"><span>'+pagamentoIcone(draft.formaPagamento)+' Líquido salário (via '+draft.formaPagamento+')</span><span class="val">R$ '+toBRL(liq)+'</span></div>' +
      '<div class="sr" style="margin-top:8px;"><span>🍱 Vale Alimentação</span><span class="val">R$ '+toBRL(draft.valeAlimentacao)+'</span></div>' +
      '<div class="sr"><span>🍱 Vale Transporte</span><span class="val">R$ '+toBRL(draft.valeTransporte)+'</span></div>' +
      '<div class="sr total"><span>🍱 Total via Caju</span><span class="val">R$ '+toBRL(caju)+'</span></div>' +
      '<div class="sr total" style="border-top:2px solid var(--ink);margin-top:8px;padding-top:8px;font-size:16px;"><span>Total geral a pagar</span><span class="val">R$ '+toBRL(totalGeralFunc)+'</span></div>';
  }

  renderBody();

  $('#empSave', ov).addEventListener('click', function(){
    if(!draft.nome.trim()){ toast('Informe o nome do funcionário.', 'bad'); return; }
    draft.proventosExtras = draft.proventosExtras.filter(function(x){ return x.descricao.trim() || toNum(x.valor)!==0; });
    draft.descontosExtras = draft.descontosExtras.filter(function(x){ return x.descricao.trim() || toNum(x.valor)!==0; });
    if(isNew){
      state.funcionarios.push(draft);
      toast('Funcionário adicionado a "'+draft.loja+'".', 'good');
    } else {
      var idx = state.funcionarios.findIndex(function(x){ return x.id===draft.id; });
      state.funcionarios[idx] = draft;
      toast('Alterações salvas.', 'good');
    }
    markDirty();
    closeModal();
    renderSidebar();
    renderMain();
  });
}
/* ===================== RATEIO ENTRE LOJAS ===================== */
/* Usado principalmente na "folha de diretoria" (loja Administração/Sócios),
   onde diretores e alguns funcionários têm o custo do salário dividido entre
   mais de uma loja da rede. Pode ser usado a partir de qualquer loja. */
function openRateioModal(f){
  var draft = (f.rateioLojas||[]).filter(function(r){return r.loja;}).map(function(r){ return {loja:r.loja, percentual:toNum(r.percentual)}; });
  if(!draft.length) draft = [{loja:f.loja, percentual:100}];
  var total = calcTotalPagar(f);

  var html =
    '<div class="modal-head"><h2>🔀 Rateio entre lojas — '+escapeHtml(f.nome)+'</h2><button class="icon-btn" id="ratClose">✕</button></div>' +
    '<div class="modal-body">' +
      '<p style="font-size:12.5px;color:var(--ink-dim);">Para funcionários pagos ou alocados em mais de uma loja (comum na diretoria/administração), divida aqui o percentual do custo total (R$ '+toBRL(total)+') que deve ser atribuído a cada loja nos relatórios e totais. O funcionário continua listado na loja cadastrada no cadastro; o rateio afeta apenas os totais financeiros por loja.</p>' +
      '<div id="ratRows"></div>' +
      '<button class="btn btn-sm" id="ratAddRow" style="margin-top:8px;">+ Adicionar loja</button>' +
      '<div id="ratSomaAviso" style="margin-top:12px;font-size:12.5px;font-weight:700;"></div>' +
    '</div>' +
    '<div class="modal-foot">' +
      '<button class="btn btn-danger" id="ratLimpar">Remover rateio (100% na loja cadastrada)</button>' +
      '<button class="btn" id="ratCancel">Cancelar</button>' +
      '<button class="btn btn-primary" id="ratSave">Salvar rateio</button>' +
    '</div>';
  var ov = openModal(html, {large:true});
  $('#ratClose', ov).addEventListener('click', closeModal);
  $('#ratCancel', ov).addEventListener('click', closeModal);

  function renderRows(){
    var c = $('#ratRows', ov);
    c.innerHTML = draft.map(function(r, idx){
      return '<div class="line-item" data-idx="'+idx+'">' +
        '<select data-field="loja" style="flex:2;">'+lojaOptionsHtml(r.loja)+'</select>' +
        '<input type="number" step="0.01" min="0" max="100" data-field="percentual" value="'+r.percentual+'" style="flex:1;">' +
        '<span style="font-size:12px;color:var(--ink-dim);white-space:nowrap;">% · R$ '+toBRL(round2(total * toNum(r.percentual)/100))+'</span>' +
        '<button class="rm" title="Remover">✕</button>' +
      '</div>';
    }).join('');
    $all('.line-item', c).forEach(function(row){
      var idx = parseInt(row.dataset.idx,10);
      row.querySelector('[data-field=loja]').addEventListener('change', function(e){ draft[idx].loja = e.target.value; renderSoma(); });
      row.querySelector('[data-field=percentual]').addEventListener('input', function(e){ draft[idx].percentual = toNum(e.target.value); renderRows(); });
      row.querySelector('.rm').addEventListener('click', function(){ draft.splice(idx,1); renderRows(); });
    });
    renderSoma();
  }
  function renderSoma(){
    var soma = draft.reduce(function(s,r){ return s+toNum(r.percentual); }, 0);
    var aviso = $('#ratSomaAviso', ov);
    var ok = Math.abs(soma-100) < 0.01;
    aviso.style.color = ok ? 'var(--good)' : 'var(--bad)';
    aviso.textContent = 'Soma dos percentuais: ' + soma.toFixed(2).replace('.',',') + '%' + (ok ? ' ✓' : ' — deve totalizar 100%');
  }
  $('#ratAddRow', ov).addEventListener('click', function(){
    var usadas = draft.map(function(r){return r.loja;});
    var proxima = state.lojas.find(function(l){ return usadas.indexOf(l) === -1; }) || state.lojas[0];
    draft.push({loja: proxima, percentual: 0});
    renderRows();
  });
  $('#ratLimpar', ov).addEventListener('click', function(){
    f.rateioLojas = [];
    markDirty();
    closeModal();
    renderSidebar();
    renderMain();
    toast('Rateio removido — 100% do custo volta para "'+f.loja+'".', 'good');
  });
  $('#ratSave', ov).addEventListener('click', function(){
    var limpo = draft.filter(function(r){ return r.loja && toNum(r.percentual) > 0; });
    var soma = limpo.reduce(function(s,r){ return s+toNum(r.percentual); }, 0);
    if(limpo.length <= 1){
      f.rateioLojas = [];
    } else if(Math.abs(soma-100) > 0.5){
      toast('A soma dos percentuais precisa ficar em 100% (está em '+soma.toFixed(2).replace('.',',')+'%).', 'bad');
      return;
    } else {
      f.rateioLojas = limpo;
    }
    markDirty();
    closeModal();
    renderSidebar();
    renderMain();
    toast('Rateio de "'+f.nome+'" salvo.', 'good');
  });

  renderRows();
}
/* ===================== BACKUP (exportar/importar JSON) ===================== */
function exportBackup(){
  var blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'trok_folha_backup_' + state.competencia.replace('/','-') + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  toast('Backup gerado. Guarde o arquivo em local seguro.', 'good');
}
function importBackup(file){
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var parsed = JSON.parse(e.target.result);
      if(!parsed.funcionarios || !Array.isArray(parsed.funcionarios)) throw new Error('formato inválido');
      confirmDialog('Restaurar backup', 'Isso vai substituir TODOS os dados atuais pelos dados do arquivo selecionado. Deseja continuar?', function(){
        state = parsed;
        if(!state.catalogo) state.catalogo = CATALOGO_PADRAO.slice();
        if(!state.historico) state.historico = {};
        if(!state.datasPagamento) state.datasPagamento = {};
        state.funcionarios.forEach(migrarFuncionario);
        markDirty();
        saveState();
        renderApp();
        toast('Backup restaurado com sucesso.', 'good');
      });
    }catch(err){
      toast('Arquivo inválido. Selecione um backup gerado por este app.', 'bad');
    }
  };
  reader.readAsText(file);
}

        '<div id="lojaRows"></div>' +
        '<div style="display:flex;gap:8px;margin-top:10px;"><input type="text" id="novaLojaInput" placeholder="Nome da nova loja" style="flex:1;padding:7px 9px;border:1px solid var(--line);border-radius:7px;"><button class="btn" id="addLojaBtn">+ Adicionar loja</button></div>';
      renderLojaRows();
      $('#addLojaBtn', body).addEventListener('click', function(){
        var v = $('#novaLojaInput', body).value.trim();
        if(!v) return;
        if(state.lojas.indexOf(v) > -1){ toast('Essa loja já existe.', 'bad'); return; }
        state.lojas.splice(state.lojas.length-2, 0, v); // antes de Administração/A Definir
        $('#novaLojaInput', body).value = '';
        renderLojaRows();
      });
    } else if(tab === 'empresas'){
      body.innerHTML = '<p style="font-size:12.5px;color:var(--ink-dim);">Empresas usadas para classificar os funcionários (Contractus, BM Comércio, Mud Scap, etc).</p>' +
        '<div id="empresaRows"></div>' +
        '<div style="display:flex;gap:8px;margin-top:10px;"><input type="text" id="novaEmpresaInput" placeholder="Nome da empresa" style="flex:1;padding:7px 9px;border:1px solid var(--line);border-radius:7px;"><button class="btn" id="addEmpresaBtn">+ Adicionar</button></div>';
      renderEmpresaRows();
      $('#addEmpresaBtn', body).addEventListener('click', function(){
        var v = $('#novaEmpresaInput', body).value.trim();
        if(!v) return;
        if(state.empresas.indexOf(v) > -1){ toast('Essa empresa já existe.', 'bad'); return; }
        state.empresas.push(v);
        $('#novaEmpresaInput', body).value = '';
        renderEmpresaRows();
      });
    } else {
      body.innerHTML = '<p style="font-size:12.5px;color:var(--ink-dim);">Palavras-chave usadas para classificar automaticamente os eventos da folha (proventos x descontos) ao importar PDFs. A busca não diferencia maiúsculas/acentos.</p>' +
        '<div id="catRows"></div>' +
        '<div style="display:flex;gap:8px;margin-top:10px;"><input type="text" id="novaChave" placeholder="Palavra-chave (ex: vale combustível)" style="flex:2;padding:7px 9px;border:1px solid var(--line);border-radius:7px;">' +
        '<select id="novoTipo" style="padding:7px 9px;border:1px solid var(--line);border-radius:7px;"><option value="provento">Provento</option><option value="desconto">Desconto</option></select>' +
        '<button class="btn" id="addCatBtn">+ Adicionar</button></div>';
      renderCatRows();
      $('#addCatBtn', body).addEventListener('click', function(){
        var v = $('#novaChave', body).value.trim().toLowerCase();
        if(!v) return;
        state.catalogo.push({chave:v, tipo:$('#novoTipo', body).value});
        $('#novaChave', body).value = '';
        renderCatRows();
      });

  function renderLojaRows(){
    var c = $('#lojaRows', ov);

      return '<div class="line-item" data-i="'+i+'">' +
        '<input type="text" value="'+escapeHtml(l)+'" data-field="nome" '+(fixed?'disabled':'')+' style="flex:2;">' +
        '<span style="font-size:11.5px;color:var(--ink-dim);min-width:70px;">'+count+' func.</span>' +
        (fixed?'':'<button class="rm" title="Remover">✕</button>') +
      '</div>';
    }).join('');
    $all('.line-item', c).forEach(function(row){
      var i = parseInt(row.dataset.i,10);
      var inp = row.querySelector('input');
      inp.addEventListener('change', function(){
        var novo = inp.value.trim();
        if(!novo) { inp.value = state.lojas[i]; return; }
        var antigo = state.lojas[i];
        state.funcionarios.forEach(function(f){ if(f.loja===antigo) f.loja = novo; });
        state.lojas[i] = novo;
        renderLojaRows();
      });
      var rm = row.querySelector('.rm');
      if(rm) rm.addEventListener('click', function(){
        var antigo = state.lojas[i];
        state.funcionarios.forEach(function(f){ if(f.loja===antigo) f.loja = 'A Definir'; });
        state.lojas.splice(i,1);
        renderLojaRows();

  function renderEmpresaRows(){
    var c = $('#empresaRows', ov);
    c.innerHTML = state.empresas.map(function(e, i){
      return '<div class="line-item" data-i="'+i+'"><input type="text" value="'+escapeHtml(e)+'" style="flex:2;"><button class="rm">✕</button></div>';

      row.querySelector('input').addEventListener('change', function(ev2){ state.empresas[i] = ev2.target.value.trim() || state.empresas[i]; });
      row.querySelector('.rm').addEventListener('click', function(){ state.empresas.splice(i,1); renderEmpresaRows(); });
    });
  }
  function renderCatRows(){
    var c = $('#catRows', ov);
    c.innerHTML = state.catalogo.map(function(item, i){
      return '<div class="line-item" data-i="'+i+'">' +
        '<input type="text" value="'+escapeHtml(item.chave)+'" style="flex:2;">' +

        '<button class="rm">✕</button>' +

    }).join('');
    $all('.line-item', c).forEach(function(row){
      var i = parseInt(row.dataset.i,10);
      row.querySelector('input').addEventListener('change', function(ev2){ state.catalogo[i].chave = ev2.target.value.trim().toLowerCase(); });
      row.querySelector('select').addEventListener('change', function(ev2){ state.catalogo[i].tipo = ev2.target.value; });
      row.querySelector('.rm').addEventListener('click', function(){ state.catalogo.splice(i,1); renderCatRows(); });
    });
  }

  renderTabs();
  renderBody();
}

/* ===================== HISTÓRICO ===================== */
function openHistoricoModal(){
  var competencias = Object.keys(state.historico||{}).sort().reverse();
  var html =
    '<div class="modal-head"><h2>Histórico de competências</h2><button class="icon-btn" id="histClose">✕</button></div>' +
    '<div class="modal-body" id="histBody">' +
      '<div class="panel" style="padding:10px 12px;margin-bottom:16px;">' +
        '<div class="section-title" style="margin-top:0;">🔎 Consultar pagamentos de um dia específico</div>' +
        '<div style="font-size:12px;color:var(--ink-dim);margin-bottom:6px;">Veja quanto saiu (folha completa e/ou adiantamento) numa data exata, com base na data de pagamento informada em cada importação.</div>' +
        '<input type="date" id="histBuscaData" style="max-width:200px;">' +
        '<div id="histBuscaResultado" style="margin-top:10px;"></div>' +
      '</div>' +
      (competencias.length===0
        ? '<div class="empty-state"><div class="es-icon">📚</div>Nenhuma competência arquivada ainda.<br>O histórico é salvo automaticamente sempre que você confirma a importação de uma nova folha mensal.</div>'
        : '<div class="checklist">'+competencias.map(function(c){
            var d = (state.datasPagamento && state.datasPagamento[c]) || {};
            var datasTxt = [d.completa ? 'Folha '+dataBR(d.completa) : null, d.adiantamento ? 'Adiant. '+dataBR(d.adiantamento) : null].filter(Boolean).join(' · ');
            return '<div class="chk-pill" data-c="'+escapeHtml(c)+'" style="cursor:pointer;position:relative;padding-right:26px;">📅 '+escapeHtml(c)+
              (datasTxt ? '<div style="font-size:10px;color:var(--ink-dim);font-weight:400;margin-top:2px;">'+datasTxt+'</div>' : '<div style="font-size:10px;color:var(--ink-dim);font-weight:400;margin-top:2px;">Sem data de pagamento definida</div>') +
              '<button class="icon-btn hist-editar-datas" data-c="'+escapeHtml(c)+'" title="Editar data de pagamento" style="position:absolute;top:4px;right:4px;width:20px;height:20px;font-size:11px;">✏️</button>' +
            '</div>';
          }).join('')+'</div><div id="histDetail" style="margin-top:16px;"></div>') +
    '</div>' +
    '<div class="modal-foot"><button class="btn" id="histDone">Fechar</button></div>';
  var ov = openModal(html, {large:true});
  $('#histClose', ov).addEventListener('click', closeModal);
  $('#histDone', ov).addEventListener('click', closeModal);

  $('#histBuscaData', ov).addEventListener('change', function(e){ renderBuscaPorData(e.target.value); });
  function renderBuscaPorData(dataStr){
    var out = $('#histBuscaResultado', ov);
    if(!dataStr){ out.innerHTML = ''; return; }
    var matches = [];
    Object.keys(state.datasPagamento||{}).forEach(function(comp){
      var d = state.datasPagamento[comp];
      if(d.completa === dataStr) matches.push({comp:comp, tipo:'completa'});
      if(d.adiantamento === dataStr) matches.push({comp:comp, tipo:'adiantamento'});
    });
    if(!matches.length){
      out.innerHTML = '<div style="font-size:12.5px;color:var(--ink-dim);">Nenhum pagamento com data de '+dataBR(dataStr)+' registrado.</div>';
      return;
    }
    out.innerHTML = matches.map(function(m){
      var lista, total, rotulo;
      if(m.tipo === 'completa'){
        lista = (m.comp === state.competencia) ? state.funcionarios.filter(function(f){return f.ativo!==false;}) : (state.historico[m.comp]||[]);
        total = lista.reduce(function(s,f){ return s + calcLiquido(f); }, 0);
        rotulo = '📄 Folha completa · competência '+escapeHtml(m.comp);
      } else {
        lista = state.funcionarios.filter(function(f){ return f.adiantamentos && f.adiantamentos[m.comp]; });
        total = lista.reduce(function(s,f){ return s + toNum(f.adiantamentos[m.comp].valorLiquido); }, 0);
        rotulo = '💰 Adiantamento (dia 15) · competência '+escapeHtml(m.comp);
      }
      return '<div class="summary-box" style="margin-top:8px;">' +
        '<div class="sr total"><span>'+rotulo+'</span><span class="val">R$ '+toBRL(total)+'</span></div>' +
        '<div style="font-size:11px;color:var(--ink-dim);margin-top:2px;">'+lista.length+' funcionário(s)</div>' +
      '</div>';
    }).join('');
  }

  function editarDatasCompetencia(comp){
    var existentes = (state.datasPagamento && state.datasPagamento[comp]) || {};
    pedirDataPagamento('a Folha completa (dia 30) — competência '+comp, existentes.completa || '', function(dataCo){
      pedirDataPagamento('o Adiantamento (dia 15) — competência '+comp, existentes.adiantamento || '', function(dataAd){
        if(!state.datasPagamento) state.datasPagamento = {};
        state.datasPagamento[comp] = {completa: dataCo, adiantamento: dataAd};
        markDirty();
        saveState();
        closeModal();
        openHistoricoModal();
        toast('Data(s) de pagamento de '+comp+' atualizada(s).', 'good');
      }, {permitirPular:true});
    }, {permitirPular:true});
  }
  $all('.hist-editar-datas', ov).forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      editarDatasCompetencia(btn.dataset.c);
    });
  });

  $all('.chk-pill', ov).forEach(function(p){
    p.addEventListener('click', function(){
      $all('.chk-pill', ov).forEach(function(x){ x.style.background = '#fff'; });
      p.style.background = 'var(--accent-soft)';
      var comp = p.dataset.c;
      var snap = state.historico[comp] || [];
      var total = snap.reduce(function(s,f){ return s + calcLiquido(f); }, 0);
      var byLoja = {};
      snap.forEach(function(f){ byLoja[f.loja] = (byLoja[f.loja]||0) + calcLiquido(f); });
      var det = $('#histDetail', ov);
      det.innerHTML = '<div class="section-title">Resumo — '+escapeHtml(comp)+'</div>' +
        '<table class="review-table"><thead><tr><th>Loja</th><th>Funcionários</th><th>Total líquido</th></tr></thead><tbody>' +
        Object.keys(byLoja).sort().map(function(l){
          var n = snap.filter(function(f){return f.loja===l;}).length;
          return '<tr><td>'+escapeHtml(l)+'</td><td>'+n+'</td><td>R$ '+toBRL(byLoja[l])+'</td></tr>';
        }).join('') +
        '</tbody></table>' +
        '<div class="summary-box"><div class="sr total"><span>Total geral '+escapeHtml(comp)+'</span><span class="val">R$ '+toBRL(total)+'</span></div></div>';
    });
  });
}
/* ===================== IMPRESSÃO ===================== */
function itemsCellHtml(items, sign){
  if(!items || items.length === 0) return '<span class="rpt-dash">—</span>';
  var isProvento = sign === '+';
  return items.map(function(it){
    return '<div class="rpt-item-line'+(isProvento?' is-provento':'')+'">'+escapeHtml(it.descricao||'(sem descrição)')+' <b>'+sign+' R$ '+toBRL(it.valor)+'</b></div>';
  }).join('');
}
function recebimentoCellHtml(f, frac){
  frac = (frac===undefined || frac===null) ? 1 : frac;
  var fp = FORMAS_PAGAMENTO_SALARIO.indexOf(f.formaPagamento) > -1 ? f.formaPagamento : 'Banco';
  var liquido = round2(calcLiquido(f) * frac);
  // VA/VT (Caju) não são divididos pelo rateio: o valor cheio é o que é cadastrado
  // para pagamento em cada loja, então aparecem sempre integrais aqui.
  var va = round2(toNum(f.valeAlimentacao)), vt = round2(toNum(f.valeTransporte));
  var lines = ['<div class="rpt-pagto is-'+fp+'">'+pagamentoIcone(fp)+' '+fp+': <b>R$ '+toBRL(liquido)+'</b></div>'];
  if(va > 0) lines.push('<div class="rpt-pagto is-Caju">🍱 VA (Caju): <b>R$ '+toBRL(va)+'</b></div>');
  if(vt > 0) lines.push('<div class="rpt-pagto is-Caju">🍱 VT (Caju): <b>R$ '+toBRL(vt)+'</b></div>');
  if(frac < 1) lines.push('<div style="font-size:10px;color:#7a6a4a;">('+Math.round(frac*100)+'% do salário atribuído a esta loja · Caju integral)</div>');
  return lines.join('');
}
