var PDFJS_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
var PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
var pdfjsLoaded = false;
function ensurePdfJs(cb, errCb){
  if(pdfjsLoaded && window['pdfjsLib']){ cb(); return; }
  var s = document.createElement('script');
  s.src = PDFJS_CDN;
  s.onload = function(){
    try{
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
      pdfjsLoaded = true;
      cb();
    }catch(e){ errCb(e); }
  };
  s.onerror = function(e){ errCb(e); };
  document.head.appendChild(s);
}

function linesFromTextItems(items){
  var pts = items.filter(function(it){ return it.str && it.str.trim(); })
    .map(function(it){ return {str: it.str, x: it.transform[4], y: it.transform[5]}; });
  pts.sort(function(a,b){ return (b.y - a.y) || (a.x - b.x); });
  var lines = [];
  var current = [];
  var curY = null;
  var TOL = 3;
  for(var i=0;i<pts.length;i++){
    var it = pts[i];
    if(curY === null || Math.abs(it.y - curY) <= TOL){
      current.push(it);
      if(curY === null) curY = it.y;
    } else {
      lines.push(flattenLine(current));
      current = [it];
      curY = it.y;
    }
  }
  if(current.length) lines.push(flattenLine(current));
  return lines;
}
function flattenLine(items){
  items.sort(function(a,b){ return a.x - b.x; });
  var text = items.map(function(i){ return i.str; }).join(' ');
  text = text.replace(/\s+/g,' ').trim();
  text = text.replace(/(\d)\s+,\s*(\d)/g, '$1,$2');
  text = text.replace(/(\d)\s+\.\s*(\d)/g, '$1.$2');
  return text;
}

function extractPdfText(arrayBuffer){
  return window.pdfjsLib.getDocument({data:arrayBuffer}).promise.then(function(pdf){
    var pagePromises = [];
    for(var p=1;p<=pdf.numPages;p++){
      pagePromises.push(pdf.getPage(p).then(function(page){
        return page.getTextContent().then(function(content){
          return linesFromTextItems(content.items).join('\n');
        });
      }));
    }
    return Promise.all(pagePromises).then(function(pages){ return pages.join('\n'); });
  });
}

/* ----- parser de texto da folha (Fortes Pessoal) ----- */
var NOISE_RE = [
  /^Folha de Pagamento Pag\.:/, /^Empresa:/, /^Mês\/Ano:/, /^Emiss[aã]o:/,
  /^Estabelecimento:/, /^C[oó]digo Empregado Evento/, /^Continua\.\.\.$/,
  /^Admiss[aã]o Dep\. Filhos/
];
function parseFolhaTexto(texto){
  var linhas = texto.split('\n').map(function(l){return l.trim();}).filter(Boolean);
  var out = [];
  var i = 0, n = linhas.length, pendingObs = null;
  while(i < n){
    var line = linhas[i];
    if(NOISE_RE.some(function(re){ return re.test(line); })){ i++; continue; }
    if(/^Total Geral/.test(line)) break;
    if(/^(Férias|Licença)\b/i.test(line) && !/^\d{6}\s/.test(line)){ pendingObs = line; i++; continue; }
    var mEmp = line.match(/^(\d{6})\s+(.+)$/);
    if(mEmp){
      var codigo = mEmp[1], nome = mEmp[2].trim();
      i++;
      var cargo = '';
      if(i<n && /^Cargo:/.test(linhas[i])){ cargo = linhas[i].replace(/^Cargo:\s*/,'').trim(); i++; }
      var eventos = [];
      var totalProvento = '0,00', totalDesconto = '0,00';
      while(i<n){
        var l = linhas[i];
        var mt = l.match(/^([\d.]+,\d{2})\s+([\d.]+,\d{2})$/);
        if(mt){ totalProvento = mt[1]; totalDesconto = mt[2]; i++; break; }
        var me = l.match(/^(\d{3})\s+(.+?)\s+([\d.]+,\d{2})$/);
        if(me){ eventos.push({codigo:me[1], detalhe:me[2], valor:me[3]}); i++; continue; }
        break;
      }
      var fgts = '', liquido = '';
      if(i<n && /^FGTS:/.test(linhas[i])){
        var mf = linhas[i].match(/^FGTS:\s*([\d.,]*)\s*L[ií]quido a receber:\s*([\d.,]+)$/i);
        if(mf){ fgts = mf[1]; liquido = mf[2]; }
        i++;
      }
      if(i<n && /^Admiss[aã]o Dep/.test(linhas[i])) i++;
      var admissao = '', salarioContratual = '';
      if(i<n){
        var ma = linhas[i].match(/^(\d{2}\/\d{2}\/\d{4})\s*(.*)$/);
        if(ma){
          admissao = ma[1];
          var rest = ma[2].trim().split(/\s+/).filter(Boolean);
          if(rest.length >= 4) salarioContratual = rest[3];
          i++;
        }
      }
      out.push({codigo:codigo, nome:nome, cargo:cargo, eventos:eventos,
        totalProvento:totalProvento, totalDesconto:totalDesconto, fgts:fgts, liquido:liquido,
        admissao:admissao, salarioContratual:salarioContratual, observacao: pendingObs || ''});
      pendingObs = null;
      continue;
    }
    i++;
  }
  return out;
}
/* Identifica se o texto extraído do PDF é uma folha completa (dia 30, "Folha de
   Pagamento") ou um adiantamento quinzenal (dia 15, "Adiantamento de Folha"). */
function detectFormatoFolha(texto){
  if(/Adiantamento de Folha/i.test(texto)) return 'adiantamento';
  if(/Folha de Pagamento/i.test(texto)) return 'completa';
  return 'desconhecida';
}

/* ----- parser de texto do adiantamento quinzenal (dia 15, Fortes Pessoal) -----
   Lê apenas a tabela-resumo do início do relatório (Código / Empregado /
   Referência / Valor), que já traz o valor líquido efetivamente adiantado a
   cada funcionário — os "recibos" individuais repetidos no resto do PDF são
   redundantes com essa tabela e não precisam ser reprocessados. */
function parseAdiantamentoTexto(texto){
  var linhas = texto.split('\n').map(function(l){return l.trim();}).filter(Boolean);
  var out = [];
  var i = 0, n = linhas.length, pendingObs = null;
  while(i < n && !/^C[oó]digo\s+Empregado\s+Refer[eê]ncia\s+Valor/i.test(linhas[i])) i++;
  if(i < n) i++; // pula a própria linha de cabeçalho da tabela
  if(i < n && /^de\s*c[aá]lculo$/i.test(linhas[i])) i++; // quebra "Demonstrativo / de cálculo"
  while(i < n){
    var line = linhas[i];
    if(/^Total Geral/i.test(line)) break;
    if(/^Recibo de Pagamento/i.test(line)) break; // fim da tabela-resumo, início dos recibos individuais
    if(/^(Férias|Licença)\b/i.test(line) && !/^\d{6}\s/.test(line)){ pendingObs = line; i++; continue; }
    var mEmp = line.match(/^(\d{6})\s+(.+)$/);
    if(mEmp){
      var codigo = mEmp[1];
      var rest = mEmp[2].trim();
      var m = rest.match(/^(.*?)(?:\s+([\d.]+,\d{2}))?\s+(\d{1,3}%)\s+(-?[\d.,]+,\d{2})$/);
      var nome, salarioContratual = '', referencia = '', valorBruto = null;
      if(m){
        nome = m[1].trim();
        salarioContratual = m[2] || '';
        referencia = m[3];
        valorBruto = m[4];
      } else {
        nome = rest; // sem valor nesta competência (ex: em férias/licença)
      }
      i++;
      var provisaoValor = null;
      if(i < n){
        var mp = linhas[i].match(/^077\s+Provis[ãa]o Cred\.?\s*Trab\.?-?\s*Desconto\s+\d{1,3}%\s+(-?[\d.,]+,\d{2})$/i);
        if(mp){ provisaoValor = mp[1]; i++; }
      }
      var valorLiquido = valorBruto;
      if(provisaoValor !== null && i < n){
        var ml = linhas[i].match(/^(-?[\d.,]+,\d{2})$/);
        if(ml){ valorLiquido = ml[1]; i++; }
      }
      out.push({
        codigo: codigo, nome: nome, salarioContratual: salarioContratual,
        referencia: referencia, valorBruto: valorBruto, provisaoValor: provisaoValor,
        valorLiquido: valorLiquido, observacao: pendingObs || ''
      });
      pendingObs = null;
      continue;
    }
    i++;
  }
  return out;
}

function extrairCabecalho(texto){
  var mEmp = texto.match(/Empresa:\s*(.+?)\s*-\s*CNPJ/);
  var mEst = texto.match(/Estabelecimento:\s*(.+?)\s*-\s*[\d.\/-]+\s*$/m);
  var mComp = texto.match(/Mês\/Ano:\s*(\d{2}\/\d{4})/);
  return {
    empresaRaw: mEmp ? mEmp[1].trim() : '',
    estabelecimento: mEst ? mEst[1].trim() : '',
    competencia: mComp ? mComp[1] : ''
  };
}
function normalizeEmpresa(raw){
  var u = stripAccents(raw||'').toUpperCase();
  if(u.indexOf('CONTRACTUS') > -1) return 'Contractus';
  if(u.indexOf('BM COMERCIO') > -1 || u.indexOf('BM COMÉRCIO') > -1) return 'BM Comércio';
  if(u.indexOf('MUD SCAP') > -1) return 'Mud Scap';
  return raw || '';
}
function classificarEvento(detalhe){
  var d = stripAccents(detalhe||'').toLowerCase();
  // regras fixas de prioridade
  if(d.indexOf('liquido negativo compensacao') > -1) return 'desconto';
  if(d.indexOf('liquido negativo') > -1) return 'provento';
  for(var i=0;i<state.catalogo.length;i++){
    var c = state.catalogo[i];
    if(c.tipo === 'desconto' && d.indexOf(stripAccents(c.chave).toLowerCase()) > -1) return 'desconto';
  }
  for(i=0;i<state.catalogo.length;i++){
    var c2 = state.catalogo[i];
    if(c2.tipo === 'provento' && d.indexOf(stripAccents(c2.chave).toLowerCase()) > -1) return 'provento';
  }
  return null;
}
function transformarFuncionarioPdf(p, empresa, estabelecimento){
  var baseMes = 0;
  var proventosExtras = [], descontosExtras = [];
  var naoClassificados = [];
  p.eventos.forEach(function(ev){
    var d = stripAccents(ev.detalhe).toLowerCase();
    var val = toNum(ev.valor);
    if(d.indexOf('salario-base') > -1 || d.indexOf('pro labore') > -1){
      baseMes += val;
      return;
    }
    var tipo = classificarEvento(ev.detalhe);
    if(tipo === null){ naoClassificados.push(ev); tipo = 'provento'; }
    var item = {id: uid(tipo==='provento'?'p':'d'), descricao: ev.detalhe.trim(), valor: val};
    if(tipo === 'provento') proventosExtras.push(item); else descontosExtras.push(item);
  });
  return {
    codigo: p.codigo, nomeOriginal: p.nome, cargo: p.cargo,
    empresa: empresa, estabelecimento: estabelecimento, admissao: p.admissao,
    salarioContratual: toNum(p.salarioContratual), salarioBaseMes: round2(baseMes),
    proventosExtras: proventosExtras, descontosExtras: descontosExtras,
    observacao: p.observacao, naoClassificados: naoClassificados,
    liquidoOriginalPdf: toNum(p.liquido)
  };
}

/* ----- correspondência com funcionários existentes -----
   Prioridade 1: código de empregado (Fortes Pessoal) + empresa — é a chave estável
   que o próprio sistema de folha usa, então evita falso-positivo por nome parecido
   (ex.: "JOSE MAURO DE SOUSA" vs "JOSE FRANCISCO COSTA SOUSA" batiam por nome antes).
   Prioridade 2 (fallback): correspondência fuzzy por nome — usada só quando o código
   não bate com ninguém do cadastro (funcionário realmente novo, ou código mudou). */
function melhorCorrespondencia(nome, codigo, empresa){
  if(codigo && empresa){
    var porCodigo = null;
    state.funcionarios.forEach(function(f){
      if(!porCodigo && f.codigo === codigo && f.empresa === empresa) porCodigo = f;
    });
    if(porCodigo) return {funcionario: porCodigo, score: 1, porCodigo: true};
    // O PDF trouxe um código de empregado e ele não existe nesta empresa: é (quase
    // certamente) um funcionário novo. Não arriscar cair no fuzzy-por-nome aqui —
    // nomes brasileiros comuns (mesmo primeiro nome + sobrenome comum, ex. "SOUSA")
    // batem alto demais e acabam colando o registro em outra pessoa. Fica como "novo"
    // e quem revisa decide manualmente se quiser vincular a alguém existente.
    return {funcionario: null, score: 0, porCodigo: false};
  }
  // Sem código disponível (ex.: texto colado manualmente e a tabela não trouxe código) —
  // único caso em que faz sentido cair no fuzzy-por-nome.
  var toks = normName(nome);
  var best = null, bestScore = 0;
  state.funcionarios.forEach(function(f){
    var sc = nameScore(toks, normName(f.nome));
    if(sc > bestScore){ bestScore = sc; best = f; }
  });
  return {funcionario: best, score: bestScore, porCodigo: false};
}

  ui._empresasCompleta = {};
  ui._empresasAdiantamento = {};
  var html =
    '<div class="modal-head"><h2>Importar folha (PDF)</h2><button class="icon-btn" id="impClose">✕</button></div>' +
    '<div class="modal-body" id="impBody">' +
      '<div class="dropzone" id="impDrop">' +
        '<div class="dz-icon">📥</div>' +
        '<div><b>Clique para escolher</b> ou arraste os PDFs aqui</div>' +
        '<div style="font-size:11.5px;margin-top:4px;">Pode misturar os dois formatos e vários arquivos de uma vez: <b>"Folha de Pagamento"</b> (fechamento do dia 30) e/ou <b>"Adiantamento de Folha"</b> (adiantamento quinzenal do dia 15) — o app identifica automaticamente qual é qual.</div>' +
      '</div>' +
      '<input type="file" id="impFileInput" accept=".pdf" multiple style="display:none;">' +
      '<div class="filelist" id="impFileList"></div>' +
      '<details style="margin-top:14px;"><summary style="cursor:pointer;font-size:12.5px;color:var(--ink-dim);">A extração automática não funcionou bem? Cole o texto do PDF manualmente</summary>' +
        '<textarea id="impPasteArea" rows="6" style="width:100%;margin-top:8px;font-family:var(--mono);font-size:11.5px;" placeholder="Cole aqui o texto copiado do PDF (Ctrl+A, Ctrl+C dentro do PDF, depois Ctrl+V aqui)"></textarea>' +
        '<button class="btn btn-sm" id="impPasteBtn" style="margin-top:6px;">Processar texto colado</button>' +
      '</details>' +
    '</div>' +
    '<div class="modal-foot"><button class="btn" id="impCancel">Cancelar</button></div>';
  var ov = openModal(html, {large:true});
  $('#impClose', ov).addEventListener('click', closeModal);
  $('#impCancel', ov).addEventListener('click', closeModal);

  var drop = $('#impDrop', ov), input = $('#impFileInput', ov);
  drop.addEventListener('click', function(){ input.click(); });
  input.addEventListener('change', function(){ handleFiles(Array.prototype.slice.call(input.files)); });
  ['dragenter','dragover'].forEach(function(evt){
    drop.addEventListener(evt, function(e){ e.preventDefault(); drop.classList.add('drag'); });
  });
  ['dragleave','drop'].forEach(function(evt){
    drop.addEventListener(evt, function(e){ e.preventDefault(); drop.classList.remove('drag'); });
  });
  drop.addEventListener('drop', function(e){
    var files = Array.prototype.slice.call(e.dataTransfer.files).filter(function(f){ return f.type==='application/pdf' || /\.pdf$/i.test(f.name); });
    handleFiles(files);
  });
  $('#impPasteBtn', ov).addEventListener('click', function(){
    var txt = $('#impPasteArea', ov).value;
    if(!txt.trim()){ toast('Cole algum texto primeiro.', 'bad'); return; }
    processarTexto(txt, 'texto colado');
  });

  var staged = []; // {codigo,nomeOriginal,...transformado, matchSugerido, score}
  var arquivosProcessados = [];

  function handleFiles(files){
    if(!files.length) return;
    $('#impFileList', ov).innerHTML = '<div style="color:var(--ink-dim);">Lendo arquivo(s)…</div>';
    ensurePdfJs(function(){
      var chain = Promise.resolve();
      files.forEach(function(file){
        chain = chain.then(function(){
          return file.arrayBuffer().then(function(buf){
            return extractPdfText(buf).then(function(texto){
              processarTexto(texto, file.name);
            });
          }).catch(function(err){
            console.log(err);
            arquivosProcessados.push({nome:file.name, ok:false, qtd:0});
            renderFileList();
            toast('Não foi possível ler "'+file.name+'". Tente colar o texto manualmente.', 'bad');
          });
        });
      });
      chain.then(function(){
        if(staged.length) abrirRevisao();
      });
    }, function(err){
      console.log(err);
      toast('Não foi possível carregar o leitor de PDF. Use a opção de colar texto manualmente.', 'bad');
    });
  }

  function processarTexto(texto, origem){
    var cab = extrairCabecalho(texto);
    var empresa = normalizeEmpresa(cab.empresaRaw);
    var formato = detectFormatoFolha(texto);
    if(cab.competencia) ui._competenciaDetectada = cab.competencia;
    var qtd = 0;
    if(formato === 'adiantamento'){
      ui._houveAdiantamento = true;
      if(empresa) ui._empresasAdiantamento[empresa] = true;
      var parsedAd = parseAdiantamentoTexto(texto);
      parsedAd.forEach(function(p){
        var match = melhorCorrespondencia(p.nome, p.codigo, empresa);
        var item = {
          _id: uid('stg'), _tipo: 'adiantamento', _origem: origem,
          codigo: p.codigo, nomeOriginal: p.nome, cargo: '',
          empresa: empresa, estabelecimento: cab.estabelecimento,
          salarioContratual: toNum(p.salarioContratual),
          referencia: p.referencia,
          valorBruto: toNum(p.valorBruto),
          provisaoValor: p.provisaoValor ? toNum(p.provisaoValor) : 0,
          valorLiquido: toNum(p.valorLiquido),
          observacao: p.observacao
        };
        item._matchId = (match.score >= 0.85) ? match.funcionario.id : null;
        item._matchScore = match.score;
        item._matchPorCodigo = !!match.porCodigo;
        item._loja = item._matchId ? null : 'A Definir';
        item._incluir = !!p.valorBruto; // sem valor (ex: férias/licença) já vem desmarcado
        staged.push(item);
        qtd++;
      });
    } else {
      ui._houveCompleta = true;
      if(empresa) ui._empresasCompleta[empresa] = true;
      var parsed = parseFolhaTexto(texto);
      parsed.forEach(function(p){
        var t = transformarFuncionarioPdf(p, empresa, cab.estabelecimento);
        var match = melhorCorrespondencia(t.nomeOriginal, t.codigo, empresa);
        t._matchId = (match.score >= 0.85) ? match.funcionario.id : null;
        t._matchScore = match.score;
        t._matchPorCodigo = !!match.porCodigo;
        t._loja = t._matchId ? null : 'A Definir';
        t._incluir = true;
        t._tipo = 'completa';
        t._origem = origem;
        t._id = uid('stg');
        staged.push(t);
        qtd++;
      });
    }
    arquivosProcessados.push({nome:origem, ok:true, qtd:qtd, tipo:formato});
    renderFileList();
  }
  function renderFileList(){
    var c = $('#impFileList', ov);
    if(!c) return;
    c.innerHTML = arquivosProcessados.map(function(a){
      var rotulo = a.tipo==='adiantamento' ? ' — adiantamento (dia 15)' : (a.tipo==='completa' ? ' — folha completa (dia 30)' : '');
      return '<div class="fitem"><span>'+(a.ok?'✅':'⚠️')+' '+escapeHtml(a.nome)+rotulo+'</span><span>'+(a.ok ? a.qtd+' funcionário(s) lido(s)' : 'falhou')+'</span></div>';
    }).join('');
  }

  function abrirRevisao(){
    closeModal();
    renderReviewModal(staged);
  }
}

function renderReviewModal(staged){
  var novos = staged.filter(function(s){ return !s._matchId; }).length;
  var atualiza = staged.length - novos;
  var qtdAdiantamento = staged.filter(function(s){ return s._tipo==='adiantamento'; }).length;
  var explicacaoAdiantamento = qtdAdiantamento
    ? '<p style="font-size:12.5px;color:var(--ink-dim);">💰 '+qtdAdiantamento+' registro(s) são de <b>adiantamento quinzenal (dia 15)</b> — o valor fica guardado no cadastro do funcionário como referência e não altera o salário/proventos/descontos da folha completa (dia 30).</p>'
    : '';
  var html =
    '<div class="modal-head"><h2>Revisar importação — '+staged.length+' registro(s)</h2><button class="icon-btn" id="revClose">✕</button></div>' +
    '<div class="modal-body">' +
      '<p style="font-size:12.5px;color:var(--ink-dim);">'+atualiza+' serão <b>atualizados</b> (funcionário já existe) e '+novos+' serão <b>criados</b> como novos. Revise antes de confirmar — você pode desmarcar itens, trocar a correspondência ou escolher a loja de cada novo funcionário.</p>' +
      explicacaoAdiantamento +
      '<div id="revTableWrap"></div>' +
    '</div>' +
    '<div class="modal-foot"><button class="btn" id="revCancel">Cancelar importação</button><button class="btn btn-primary" id="revConfirm">✅ Confirmar importação</button></div>';
  var ov = openModal(html, {large:true});
  $('#revClose', ov).addEventListener('click', closeModal);
  $('#revCancel', ov).addEventListener('click', closeModal);

  function renderTable(){
    var wrap = $('#revTableWrap', ov);
    wrap.innerHTML = '<table class="review-table"><thead><tr>' +
      '<th></th><th>Nome (PDF)</th><th>Empresa</th><th>Tipo</th><th>Status / correspondência</th><th>Loja</th><th>Valor novo</th><th>Valor anterior</th>' +
      '</tr></thead><tbody>' + staged.map(rowHtml).join('') + '</tbody></table>';

    $all('tr[data-id]', wrap).forEach(function(row){
      var s = staged.find(function(x){ return x._id === row.dataset.id; });
      var chk = row.querySelector('[data-f=incluir]');
      chk.addEventListener('change', function(){ s._incluir = chk.checked; row.style.opacity = chk.checked?'1':'.4'; });
      var sel = row.querySelector('[data-f=match]');
      if(sel) sel.addEventListener('change', function(){
        s._matchId = sel.value === '__novo__' ? null : sel.value;
        s._matchPorCodigo = false; // escolha manual, não veio da correspondência automática por código
        renderTable();
      });
      var lojaSel = row.querySelector('[data-f=loja]');
      if(lojaSel) lojaSel.addEventListener('change', function(){ s._loja = lojaSel.value; });
    });
  }
  function rowHtml(s){
    var isAd = s._tipo === 'adiantamento';
    var atual = s._matchId ? state.funcionarios.find(function(f){return f.id===s._matchId;}) : null;
    var liquidoNovo, liquidoAntigo = null;
    if(isAd){
      liquidoNovo = toNum(s.valorLiquido);
      if(atual && atual.adiantamentos && ui._competenciaDetectada && atual.adiantamentos[ui._competenciaDetectada]){
        liquidoAntigo = toNum(atual.adiantamentos[ui._competenciaDetectada].valorLiquido);
      }
    } else {
      liquidoNovo = round2(toNum(s.salarioBaseMes) + s.proventosExtras.reduce(function(a,x){return a+x.valor;},0) - s.descontosExtras.reduce(function(a,x){return a+x.valor;},0));
      liquidoAntigo = atual ? calcLiquido(atual) : null;
    }
    var deltaClass = (liquidoAntigo!==null) ? (liquidoNovo >= liquidoAntigo ? 'delta-up' : 'delta-down') : '';
    var matchOptions = '<option value="__novo__"'+(!s._matchId?' selected':'')+'>— Criar novo funcionário —</option>' +
      state.funcionarios.slice().sort(function(a,b){return a.nome.localeCompare(b.nome,'pt-BR');}).map(function(f){
        return '<option value="'+f.id+'"'+(s._matchId===f.id?' selected':'')+'>'+escapeHtml(f.nome)+' ('+escapeHtml(f.loja)+')</option>';
      }).join('');
    return '<tr data-id="'+s._id+'" style="'+(s._incluir?'':'opacity:.4;')+'">' +
      '<td><input type="checkbox" data-f="incluir"'+(s._incluir?' checked':'')+'></td>' +
      '<td><b>'+escapeHtml(s.nomeOriginal)+'</b><div class="emp-cargo">'+escapeHtml(s.cargo||s.observacao||'')+'</div></td>' +
      '<td>'+escapeHtml(s.empresa)+'</td>' +
      '<td>'+(isAd ? '<span class="status-pill" style="background:#fde6d2;color:#8a4710;">💰 Adiant. dia 15</span>' : '<span class="status-pill" style="background:#e1f3e6;color:#1f5c39;">📄 Folha dia 30</span>')+'</td>' +
      '<td>' + (s._matchId
          ? '<span class="status-pill update">Atualizar</span> ' + (s._matchPorCodigo
              ? '<span title="Encontrado pelo código do empregado — confiável" style="font-size:10.5px;color:#1f5c39;">🔒 por código</span>'
              : '<span title="Encontrado só por semelhança de nome — confira antes de confirmar" style="font-size:10.5px;color:#8a4710;">⚠️ por nome (conferir)</span>')
          : '<span class="status-pill new">Novo</span> ') +
        '<select data-f="match">'+matchOptions+'</select></td>' +
      '<td>' + (s._matchId
          ? escapeHtml(atual ? atual.loja : '')
          : '<select data-f="loja">'+lojaOptionsHtml(s._loja||'A Definir')+'</select>') + '</td>' +
      '<td class="'+deltaClass+'">'+(isAd && !s.valorBruto ? '<span class="rpt-dash">— (sem valor nesta comp.)</span>' : 'R$ '+toBRL(liquidoNovo))+'</td>' +
      '<td>'+(liquidoAntigo!==null ? 'R$ '+toBRL(liquidoAntigo) : '—')+'</td>' +
    '</tr>';
  }
  renderTable();

  $('#revConfirm', ov).addEventListener('click', function(){
    var incluidos = staged.filter(function(s){ return s._incluir; });
    if(incluidos.length === 0){ toast('Nenhum item selecionado para importar.', 'bad'); return; }
    var compAlvo = ui._competenciaDetectada || state.competencia;
    coletarDatasEExecutar(incluidos, compAlvo);
  });

  function coletarDatasEExecutar(incluidos, compAlvo){
    var precisaCompleta = incluidos.some(function(s){ return s._tipo !== 'adiantamento'; });
    var precisaAdiantamento = incluidos.some(function(s){ return s._tipo === 'adiantamento'; });
    var datasExistentes = (state.datasPagamento && state.datasPagamento[compAlvo]) || {};
    function defaultDia(dia){
      var partes = compAlvo.split('/'); // ['MM','AAAA']
      if(partes.length !== 2) return '';
      return partes[1] + '-' + partes[0] + '-' + dia;
    }
    function comAdiantamento(dataCompleta){
      if(precisaAdiantamento){
        pedirDataPagamento('o Adiantamento quinzenal (dia 15) — competência '+compAlvo, datasExistentes.adiantamento || defaultDia('15'), function(dataAd){
          executarImportacao(incluidos, compAlvo, {completa: dataCompleta, adiantamento: dataAd});
        });
      } else {
        executarImportacao(incluidos, compAlvo, {completa: dataCompleta, adiantamento: datasExistentes.adiantamento || null});
      }
    }
    if(precisaCompleta){
      pedirDataPagamento('a Folha completa (dia 30) — competência '+compAlvo, datasExistentes.completa || defaultDia('30'), function(dataCo){
        comAdiantamento(dataCo);
      });
    } else {
      comAdiantamento(datasExistentes.completa || null);
    }
  }

  function executarImportacao(incluidos, compAlvo, datasPagto){
    // arquivar snapshot da competência atual antes de sobrescrever
    if(state.competencia){
      state.historico[state.competencia] = JSON.parse(JSON.stringify(state.funcionarios));
    }
    if(!state.datasPagamento) state.datasPagamento = {};
    state.datasPagamento[compAlvo] = datasPagto;

    var criados = 0, atualizados = 0, adAtualizados = 0, adCriados = 0;
    var compAdiantamento = compAlvo;
    var tocadosCompleta = {}; // ids de funcionários presentes nesta importação de folha completa
    var tocadosAdiantamento = {}; // ids de funcionários presentes nesta importação de adiantamento
    incluidos.forEach(function(s){
      if(s._tipo === 'adiantamento'){
        var registroAd = {
          valorBruto: s.valorBruto, provisaoValor: s.provisaoValor, valorLiquido: s.valorLiquido,
          referencia: s.referencia, importadoEm: todayBR()
        };
        if(s._matchId){
          var fAd = state.funcionarios.find(function(x){ return x.id === s._matchId; });
          if(fAd){
            if(!fAd.adiantamentos) fAd.adiantamentos = {};
            fAd.adiantamentos[compAdiantamento] = registroAd;
            // O adiantamento (dia 15) não traz INSS/Taxa Negocial/demais descontos e
            // proventos da folha completa (dia 30) — o que estiver nesses campos é do
            // fechamento anterior e fica desatualizado assim que um novo ciclo começa.
            // Zera os itens (proventos/descontos) e usa como salário-base o valor
            // LÍQUIDO do próprio adiantamento importado (o número que realmente está
            // no PDF de hoje) — não o salário contratual cheio nem 0, que não vêm do
            // PDF. Cadastro (loja, cargo, empresa, admissão) não é tocado. Volta a ser
            // recalculado quando a próxima Folha completa (dia 30) entrar.
            fAd.proventosExtras = [];
            fAd.descontosExtras = [];
            fAd.salarioBaseMes = toNum(registroAd.valorLiquido);
            fAd.observacao = 'Aguardando Folha completa (dia 30) — valor exibido é o líquido do adiantamento de ' + compAdiantamento + ' (dia 15), ainda não o fechamento do mês.';
            tocadosAdiantamento[fAd.id] = true;
            adAtualizados++;
          }
        } else {
          var novoAd = {
            id: uid('f'), codigo: s.codigo, nome: s.nomeOriginal, cargo: '',
            empresa: s.empresa, loja: s._loja || 'A Definir', admissao: '',
            salarioContratual: s.salarioContratual, salarioBaseMes: toNum(s.valorLiquido),
            formaPagamento: 'Banco', valeAlimentacao: 0, valeTransporte: 0,
            proventosExtras: [], descontosExtras: [], rateioLojas: [],
            observacao: s.observacao || ('Cadastro criado a partir do adiantamento de ' + compAdiantamento + ' — valor exibido é o líquido do adiantamento (dia 15), ainda não o fechamento do mês.'),
            adiantamentos: {}, ativo: true
          };
          novoAd.adiantamentos[compAdiantamento] = registroAd;
          state.funcionarios.push(novoAd);
          tocadosAdiantamento[novoAd.id] = true;
          adCriados++;
        }
        return;
      }
      if(s._matchId){
        var f = state.funcionarios.find(function(x){ return x.id === s._matchId; });
        if(f){
          f.cargo = s.cargo || f.cargo;
          f.empresa = s.empresa || f.empresa;
          f.admissao = s.admissao || f.admissao;
          f.salarioContratual = s.salarioContratual || f.salarioContratual;
          f.salarioBaseMes = s.salarioBaseMes;
          f.proventosExtras = s.proventosExtras;
          f.descontosExtras = s.descontosExtras;
          f.observacao = s.observacao;
          tocadosCompleta[f.id] = true;
          atualizados++;
        }
      } else {
        var novoF = {
          id: uid('f'), codigo: s.codigo, nome: s.nomeOriginal, cargo: s.cargo,
          empresa: s.empresa, loja: s._loja || 'A Definir', admissao: s.admissao,
          salarioContratual: s.salarioContratual, salarioBaseMes: s.salarioBaseMes,
          formaPagamento: 'Banco', valeAlimentacao: 0, valeTransporte: 0,
          proventosExtras: s.proventosExtras, descontosExtras: s.descontosExtras,
          rateioLojas: [], adiantamentos: {},
          observacao: s.observacao, ativo: true
        };
        state.funcionarios.push(novoF);
        tocadosCompleta[novoF.id] = true;
        criados++;
      }
    });

    // Apaga/zera informações antigas de quem NÃO apareceu nesta importação, dentro da
    // mesma empresa importada — assim, ao subir um PDF novo (correção, funcionário que
    // saiu, etc.), os dados velhos não ficam "grudados" no cadastro indefinidamente.
    var zeradosCompleta = 0, removidosAdiantamento = 0;
    if(ui._houveCompleta){
      Object.keys(ui._empresasCompleta||{}).forEach(function(emp){
        state.funcionarios.forEach(function(f){
          if(f.empresa !== emp || f.ativo === false || tocadosCompleta[f.id]) return;
          var tinhaDados = toNum(f.salarioBaseMes) !== 0 || (f.proventosExtras&&f.proventosExtras.length) || (f.descontosExtras&&f.descontosExtras.length);
          if(tinhaDados){
            f.salarioBaseMes = 0;
            f.proventosExtras = [];
            f.descontosExtras = [];
            f.observacao = 'Não constou na última folha completa importada (' + compAdiantamento + ') — verifique.';
            zeradosCompleta++;
          }
        });
      });
    }
    if(ui._houveAdiantamento){
      Object.keys(ui._empresasAdiantamento||{}).forEach(function(emp){
        state.funcionarios.forEach(function(f){
          if(f.empresa !== emp || f.ativo === false || tocadosAdiantamento[f.id]) return;
          if(f.adiantamentos && f.adiantamentos[compAdiantamento]){
            delete f.adiantamentos[compAdiantamento];
            removidosAdiantamento++;
          }
        });
      });
    }

    if(ui._houveCompleta && ui._competenciaDetectada) state.competencia = ui._competenciaDetectada;
    markDirty();
    saveState();
    closeModal();
    ui.view = {type:'dashboard'};
    renderApp();
    var partes = [];
    if(atualizados || criados) partes.push(atualizados+' funcionário(s) atualizado(s) e '+criados+' novo(s) criado(s) (folha completa)');
    if(adAtualizados || adCriados) partes.push(adAtualizados+' adiantamento(s) atualizado(s) e '+adCriados+' novo(s) (dia 15)');
    if(zeradosCompleta) partes.push(zeradosCompleta+' funcionário(s) zerado(s) por não constarem mais na folha importada');
    if(removidosAdiantamento) partes.push(removidosAdiantamento+' adiantamento(s) antigo(s) removido(s) por não constarem mais no PDF');
    toast(partes.join(' · ') || 'Importação concluída.', 'good');
  }
}
/* ===================== BOOT ===================== */
loadState(function(usedSeed){
  renderApp();
  if(usedSeed){
    toast('Dados iniciais carregados a partir da folha de Junho/2026.', 'good');
  }
});

</script>
</body>
