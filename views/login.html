<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - TROK Service Folha de Pagamento</title>
<style>
  :root{ --ink:#1c1f23; --accent:#d97a1f; --bg:#f4f2ee; --line:#e3e0d8; --bad:#b53a3a; }
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  .box{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:32px; width:100%; max-width:340px; box-shadow:0 8px 24px rgba(0,0,0,0.08); }
  h1{ font-size:1.1rem; margin:0 0 4px; }
  p.sub{ color:#5b6168; font-size:0.85rem; margin:0 0 20px; }
  label{ display:block; font-size:0.8rem; font-weight:600; margin:0 0 6px; }
  input{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:6px; font-size:0.95rem; }
  button{ width:100%; margin-top:16px; background:var(--accent); color:#fff; border:none; padding:11px; border-radius:6px; font-weight:600; font-size:0.95rem; cursor:pointer; }
  button:hover{ opacity:0.9; }
  .erro{ color:var(--bad); font-size:0.85rem; margin-top:10px; min-height:1.2em; }
</style>
</head>
<body>
  <form class="box" id="loginForm">
    <h1>TROK Service — Folha de Pagamento</h1>
    <p class="sub">Digite a senha do financeiro para acessar.</p>
    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" autofocus autocomplete="current-password" required>
    <button type="submit">Entrar</button>
    <div class="erro" id="erro"></div>
  </form>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const senha = document.getElementById('senha').value;
      const erroEl = document.getElementById('erro');
      erroEl.textContent = '';
      try {
        const resp = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ senha })
        });
        const data = await resp.json();
        if (resp.ok && data.ok) {
          window.location.href = '/';
        } else {
          erroEl.textContent = data.error || 'Senha incorreta.';
        }
      } catch (err) {
        erroEl.textContent = 'Erro ao conectar ao servidor.';
      }
    });
  </script>
</body>
</html>
